[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hadoop-explorer-spark"
version = "1.0.0"
description = "Spark Explorer Service (PySpark & Scala Spark) for Hadoop Explorer Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hadoop-explorer-common",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "requests-kerberos>=0.14.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
