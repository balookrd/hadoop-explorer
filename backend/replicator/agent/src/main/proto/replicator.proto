syntax = "proto3";

package replicator;

option java_multiple_files = true;
option java_package = "org.apache.hadoop.explorer.replicator.generated";
option java_outer_classname = "ReplicatorProto";

// Сервис передачи данных между кластерами HDFS (DC1 -> DC2)
service DataTransferService {
  // Потоковая передача файла: первый элемент потока — метаданные, последующие — чанки байтов
  rpc TransferFile (stream TransferFileRequest) returns (TransferFileResponse);

  // Проверка статуса файла на целевом узле для инкрементальной синхронизации без повторной перекачки
  rpc CheckFile (CheckFileRequest) returns (CheckFileResponse);

  // Пакетное получение манифеста каталога для мгновенного in-memory diff между изолированными DC
  rpc GetDirectoryManifest (DirectoryManifestRequest) returns (DirectoryManifestResponse);
}

// Запрос на передачу: либо метаданные файла, либо порция данных
message TransferFileRequest {
  oneof payload {
    FileMetadata metadata = 1;
    FileChunk chunk = 2;
  }
}

// Метаданные реплицируемого файла
message FileMetadata {
  string job_id = 1;                     // Идентификатор задачи
  string source_path = 2;                // Путь к файлу в HDFS DC1
  string target_path = 3;                // Целевой путь в HDFS DC2
  int64 total_bytes = 4;                 // Общий размер файла в байтах
  uint32 file_mode = 5;                  // Права доступа (POSIX permissions)
  bool run_as_service_account = 6;       // Выполнять от системной техучетки
  string execution_principal = 7;        // Принципал Kerberos (техучетка или пользователь)
  string checksum = 8;                   // Контрольная сумма (опционально, например MD5/SHA256)
}

// Чанк бинарных данных
message FileChunk {
  string job_id = 1;                     // Идентификатор задачи
  int64 offset = 2;                      // Смещение чанка от начала файла
  bytes data = 3;                        // Бинарные данные
  bool is_last_chunk = 4;                // Флаг последнего чанка файла
}

// Ответ приемника (Receiver) по результатам передачи
message TransferFileResponse {
  string job_id = 1;                     // Идентификатор задачи
  bool success = 2;                      // Флаг успешности передачи и атомарного перемещения
  int64 bytes_written = 3;               // Фактически записано байт
  string message = 4;                    // Диагностическое сообщение или описание ошибки
  string target_path = 5;                // Итоговый путь в HDFS приемника
  string checksum = 6;                   // Вычисленная контрольная сумма записанного файла
}

// Запрос проверки статуса файла на узле назначения
message CheckFileRequest {
  string path = 1;                       // Проверяемый путь на целевом кластере
  string execution_principal = 2;        // Kerberos принципал (опционально)
  bool run_as_service_account = 3;       // Выполнять от системной техучетки
}

// Ответ со статусом файла на целевом узле
message CheckFileResponse {
  bool exists = 1;                       // Существует ли файл на целевой стороне
  int64 size = 2;                        // Фактический размер в байтах
  int64 modification_time = 3;           // Время модификации в миллисекундах
  bool is_directory = 4;                 // Является ли директорией
}

// Запрос пакетного получения манифеста каталога
message DirectoryManifestRequest {
  string path = 1;                       // Базовый путь каталога на приемнике
  string execution_principal = 2;        // Kerberos принципал (опционально)
  bool run_as_service_account = 3;       // Выполнять от системной техучетки
}

// Элемент файла в манифесте
message FileManifestEntry {
  string relative_path = 1;              // Относительный путь от корня каталога
  int64 size = 2;                        // Размер файла в байтах
  int64 modification_time = 3;           // Время модификации в миллисекундах
}

// Ответ со списком всех файлов каталога
message DirectoryManifestResponse {
  bool exists = 1;                       // Существует ли каталог
  repeated FileManifestEntry files = 2;  // Список файлов в каталоге на целевой стороне
}

// ============================================================================
// Сервис прямого конвейера метаданных Hive Metastore (Source Agent -> Target Agent)
// ============================================================================
service HmsTransferService {
  // Применение БД на целевой стороне
  rpc ApplyDatabase (ApplyDatabaseRequest) returns (HmsOperationResponse);

  // Идемпотентное создание или обновление таблицы (Create or Alter Table)
  rpc ApplyTable (ApplyTableRequest) returns (HmsOperationResponse);

  // Пакетная вставка/обновление чанка партиций
  rpc ApplyPartitionBatch (ApplyPartitionBatchRequest) returns (HmsOperationResponse);

  // Согласование (Reconciliation) лишних объектов (deleteData = false)
  rpc ReconcileExtraneous (ReconcileExtraneousRequest) returns (HmsOperationResponse);

  // Применение батча потоковых CDC событий из NOTIFICATION_LOG
  rpc ApplyCdcBatch (ApplyCdcBatchRequest) returns (HmsOperationResponse);

  // Получение среза существующих объектов на приемнике для двустороннего Diff
  rpc GetMetadataSnapshot (GetMetadataSnapshotRequest) returns (GetMetadataSnapshotResponse);
}

// Запрос создания/проверки базы данных
message ApplyDatabaseRequest {
  string job_id = 1;
  string db_name = 2;
  string location_uri = 3;
}

// Метаданные таблицы Hive
message HmsTableProto {
  string catalog_name = 1;
  string db_name = 2;
  string table_name = 3;
  string table_type = 4;
  string sd_location = 5;
  map<string, string> parameters = 6;
  repeated string partition_keys = 7;
  string input_format = 8;
  string output_format = 9;
  string serde_lib = 10;
}

// Запрос создания или изменения таблицы
message ApplyTableRequest {
  string job_id = 1;
  HmsTableProto table = 2;
}

// Метаданные партиции Hive
message HmsPartitionProto {
  string catalog_name = 1;
  string db_name = 2;
  string table_name = 3;
  repeated string values = 4;
  string location = 5;
  map<string, string> parameters = 6;
}

// Пакетная вставка партиций
message ApplyPartitionBatchRequest {
  string job_id = 1;
  string db_name = 2;
  string table_name = 3;
  repeated HmsPartitionProto partitions = 4;
}

// Значения удаляемой партиции
message HmsDroppedPartitionProto {
  repeated string values = 1;
}

// Запрос согласования и удаления лишних таблиц и партиций
message ReconcileExtraneousRequest {
  string job_id = 1;
  string db_name = 2;
  repeated string drop_tables = 3;
  string table_name = 4;
  repeated HmsDroppedPartitionProto drop_partitions = 5;
}

// Событие из NOTIFICATION_LOG Hive Metastore
message HmsNotificationEventProto {
  int64 event_id = 1;
  int32 event_time = 2;
  string event_type = 3;
  string db_name = 4;
  string table_name = 5;
  string message = 6;
  string message_format = 7;
}

// Запрос применения пачки событий CDC
message ApplyCdcBatchRequest {
  string job_id = 1;
  repeated HmsNotificationEventProto events = 2;
}

// Запрос среза метаданных для двустороннего Diff
message GetMetadataSnapshotRequest {
  string job_id = 1;
  string db_name = 2;
  string table_name = 3;
}

// Ответ со срезом метаданных
message GetMetadataSnapshotResponse {
  bool db_exists = 1;
  repeated string existing_tables = 2;
  repeated HmsPartitionProto existing_partitions = 3;
}

// Унифицированный ответ об операции с метаданными
message HmsOperationResponse {
  string job_id = 1;
  bool success = 2;
  string message = 3;
  int32 affected_count = 4;
}

