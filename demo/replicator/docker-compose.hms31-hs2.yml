# =============================================================================
# HiveServer2 3.1.3 для живой проверки событий INSERT на метасторе 3.1.
#
# Накладывается поверх docker-compose.hms31.yml. События INSERT метастор пишет, только
# если DML-клиент (здесь HiveServer2) включил hive.metastore.dml.events; на кластерах
# HDP 3.1 по умолчанию это выключено. Запросы выполняются локальным MapReduce.
# Сценарий — run-hms-insert-test.sh.
# =============================================================================

services:
  sql-hive-server:
    image: apache/hive:3.1.3
    environment:
      SERVICE_OPTS: "-Dhive.metastore.dml.events=true -Dhive.execution.engine=mr -Dmapreduce.framework.name=local -Dhive.exec.mode.local.auto=true"
