name: sql-explorer-demo

include:
  - path: ../platform/docker-compose.hms.yml

volumes:
  sql-explorer-data:
    name: sql-explorer-data

services:
  # ==========================================
  # 1. HiveServer2 - Cluster 1 (Kerberized + doAs)
  # ==========================================
  sql-hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server-1
    hostname: hive-server
    restart: unless-stopped
    entrypoint: ["bash", "-c", "rm -f /opt/hive/conf/hiveserver2.pid /tmp/hive/*.pid; mkdir -p /tmp/hive && chmod 777 /tmp/hive; until (echo > /dev/tcp/hdfs-cluster-1/9000) >/dev/null 2>&1 && (echo > /dev/tcp/hive-metastore-1/9083) >/dev/null 2>&1; do echo 'Waiting for HDFS-1 (9000) & Metastore-1 (9083)...'; sleep 2; done; exec /entrypoint.sh"]
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CUSTOM_CONF_DIR: /opt/hive/custom-conf
      IS_RESUME: "true"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/etc/security/keytabs/krb5.conf -Djava.security.auth.login.config=/opt/hive/custom-conf/jaas.conf"
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive/jaas-server-1.conf:/opt/hive/custom-conf/jaas.conf:ro
      - ./hive/hive-site.xml:/opt/hive/custom-conf/hive-site.xml:ro
      - ./hive/core-site.xml:/opt/hive/custom-conf/core-site.xml:ro
      - ./hive/hdfs-site.xml:/opt/hive/custom-conf/hdfs-site.xml:ro
      - ./hive/yarn-site.xml:/opt/hive/custom-conf/yarn-site.xml:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    depends_on:
      - sql-hive-metastore
      - kdc
    networks:
      demo-platform-net:
        aliases:
          - hive-server
          - hive-server-1

  # ==========================================
  # 1b. HiveServer2 - Cluster 2 (Kerberized + doAs)
  # ==========================================
  sql-hive-server-2:
    image: apache/hive:4.0.0
    container_name: hive-server-2
    hostname: hive-server-2
    restart: unless-stopped
    entrypoint: ["bash", "-c", "rm -f /opt/hive/conf/hiveserver2.pid /tmp/hive/*.pid; mkdir -p /tmp/hive && chmod 777 /tmp/hive; until (echo > /dev/tcp/hdfs-cluster-2/9000) >/dev/null 2>&1 && (echo > /dev/tcp/hive-metastore-2/9083) >/dev/null 2>&1; do echo 'Waiting for HDFS-2 (9000) & Metastore-2 (9083)...'; sleep 2; done; exec /entrypoint.sh"]
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CUSTOM_CONF_DIR: /opt/hive/custom-conf
      IS_RESUME: "true"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/etc/security/keytabs/krb5.conf -Djava.security.auth.login.config=/opt/hive/custom-conf/jaas.conf -Dsun.security.krb5.debug=true"
    ports:
      - "10001:10001"
      - "10003:10002"
    volumes:
      - ./hive/jaas-server-2.conf:/opt/hive/custom-conf/jaas.conf:ro
      - ./hive/hive-site-cluster2.xml:/opt/hive/custom-conf/hive-site.xml:ro
      - ./hive/core-site-cluster2.xml:/opt/hive/custom-conf/core-site.xml:ro
      - ./hive/hdfs-site-cluster2.xml:/opt/hive/custom-conf/hdfs-site.xml:ro
      - ./hive/yarn-site.xml:/opt/hive/custom-conf/yarn-site.xml:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    depends_on:
      - sql-hive-metastore-2
      - kdc
    networks:
      demo-platform-net:
        aliases:
          - hive-server-2

  # ==========================================
  # 2. Trino Coordinator (Kerberized + TPCH + Hive)
  # ==========================================
  sql-trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator
    hostname: trino-coordinator
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./hive/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
      - ./hive/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
      - ./hive/core-site-cluster2.xml:/etc/hadoop/conf/core-site-cluster2.xml:ro
      - ./hive/hdfs-site-cluster2.xml:/etc/hadoop/conf/hdfs-site-cluster2.xml:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
    depends_on:
      - kdc
      - sql-hive-metastore
    networks:
      demo-platform-net:
        aliases:
          - trino-coordinator

  # ==========================================
  # 3. Сервис SQL Explorer (Web UI + Backend)
  # ==========================================
  sql-explorer:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sql
    container_name: sql-explorer
    hostname: sql-explorer
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      CONFIG_PATH: /app/demo-config/config.demo.yaml
      KRB5_KEYTAB: /etc/security/keytabs/sql-explorer.keytab
      KRB5_PRINCIPAL: svc_sql_explorer@COMPANY.LOCAL
      KRB5_CONFIG: /etc/security/keytabs/krb5.conf
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.demo.yaml:/app/demo-config/config.demo.yaml:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - sql-explorer-data:/app/data
    depends_on:
      kdc:
        condition: service_healthy
      ldap:
        condition: service_healthy
      sql-hive-server:
        condition: service_started
      sql-hive-server-2:
        condition: service_started
      sql-trino-coordinator:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - demo-platform-net
