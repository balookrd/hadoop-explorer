# Пример инвентаря для подключения кластера YARN в AWX
# Задайте список хостов ResourceManager и сопоставьте им идентификаторы rm_id (rm1, rm2 и т.д.)

[yarn_rm]
rm1.hadoop.company.local rm_id=rm1
rm2.hadoop.company.local rm_id=rm2

[yarn_rm:vars]
ansible_user=deployer
ansible_ssh_private_key_file=/var/lib/awx/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
hadoop_conf_dir=/etc/hadoop/conf
hadoop_user=yarn
hadoop_group=hadoop
kerberos_enabled=true
yarn_keytab=/etc/security/keytabs/yarn.service.keytab
yarn_principal=yarn/{{ inventory_hostname }}@COMPANY.LOCAL
