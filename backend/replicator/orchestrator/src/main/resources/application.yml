server:
  port: 8005
  error:
    # Причина из ResponseStatusException (409 «задача уже есть», 403 для READER и т.п.) уходит
    # в поле message: без нее UI показывал оператору только «HTTP 409». Стек не отдается.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    # Трассировка включена всегда: она дает trace_id в логах и traceparent в вызовах gRPC
    # агентов, то есть позволяет собрать одну операцию из разных процессов.
    #
    # Экспорт спанов в коллектор включается отдельно — заданием адреса
    # MANAGEMENT_OTLP_TRACING_ENDPOINT (например http://otel-collector:4318/v1/traces).
    # Пока адрес не задан, экспортер не создается и спаны никуда не уходят.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: hadoop-grpc-replicator-orchestrator
  datasource:
    url: jdbc:h2:mem:replicator;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: ReplicatorHikariPool
      maximum-pool-size: 60
      minimum-idle: 20
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  flyway:
    enabled: true
    # Общие миграции плюс каталог вендора: специфика PostgreSQL (частичные индексы,
    # параметры хранения) на H2 не применяется
    locations: "classpath:db/migration/common,classpath:db/migration/{vendor}"
    # Базы, созданные прежним ddl-auto: update, помечаются как baseline, и к ним
    # применяются только последующие миграции
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Схему создают и меняют миграции Flyway. Приложение ее не правит: ddl-auto: update
      # молча подгонял базу под модель, скрывая дрейф, и в каждом окружении получалась
      # своя схема. validate роняет старт при расхождении модели и миграций.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          in_clause_parameter_padding: true
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        default_batch_fetch_size: 100
  jackson:
    property-naming-strategy: SNAKE_CASE

hadoop:
  security:
    debug: true
    auth:
      mode: mock
      admin-groups:
        - "hadoop-admins"
        - "platform-admins"
        - "superusers"
      writer-groups:
        - "data-engineers"
        - "etl-developers"
        - "replicator-operators"
        - "operators"
    mock-users:
      - username: "admin_user"
        password: "password123"
        displayName: "Александр Админов"
        email: "admin@company.local"
        groups: ["hadoop-admins", "platform-admins", "superusers"]
      - username: "writer_user"
        password: "password123"
        displayName: "Владимир Инженеров"
        email: "writer@company.local"
        groups: ["data-engineers", "etl-developers"]
      - username: "de_user"
        password: "password123"
        displayName: "Иван Датаинженеров"
        email: "de@company.local"
        groups: ["data-engineers", "spark-users"]
      - username: "reader_user"
        password: "password123"
        displayName: "Екатерина Наблюдателева"
        email: "reader@company.local"
        groups: ["bi-analysts", "junior-devs"]
      - username: "analyst_user"
        password: "password123"
        displayName: "Анна Аналитикова"
        email: "analyst@company.local"
        groups: ["bi-analysts", "analytics"]
    jwt:
      secret-key: "replicator-orchestrator-secret-key-32-chars-minimum!"
      expiration-minutes: 480
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:8005"
    cookie:
      secure: false
      same-site: "Lax"
      names:
        - "access_token"
        - "hadoop_explorer_session"

  replicator:
    grpc:
      port: ${REPLICATOR_GRPC_PORT:50050}
      enabled: ${REPLICATOR_GRPC_ENABLED:true}
      tls-enabled: ${REPLICATOR_GRPC_TLS_ENABLED:false}
    global-limit-bytes-per-sec: 104857600
    # Секрет агента задается только окружением: зашитое значение было бы единым
    # публично известным ключом для всех установок.
    agent-secret: "${REPLICATOR_AGENT_SECRET:}"
    enforce-cluster-whitelist: ${HADOOP_REPLICATOR_ENFORCE_CLUSTER_WHITELIST:true}
    agent-heartbeat-timeout-seconds: 15
    agent-offline-timeout-seconds: 45
    hms-poll-interval-ms: 5000
    hms-bootstrap-concurrency: 8
    hms-partition-batch-size: 1000
    streaming:
      enabled: ${HADOOP_REPLICATOR_STREAMING_ENABLED:${HADOOP_STREAMING_ENABLED:true}}
      poll-interval-ms: ${HADOOP_REPLICATOR_STREAMING_POLL_INTERVAL_MS:${HADOOP_STREAMING_POLL_INTERVAL_MS:1000}}
      max-events-per-batch: 100
      debounce-delay-ms: 1500
      auto-reconciliation-on-gap: true
      max-txid-lag-alert: 50000
    datacenters:
      - id: "dc1"
        name: "Дата-Центр 1 (Primary DC)"
        network-zone: "zone-a"
      - id: "dc2"
        name: "Дата-Центр 2 (Disaster Recovery)"
        network-zone: "zone-b"
    clusters:
      - id: "dc1"
        name: "DC1 Production Cluster"
        dc-id: "dc1"
        hdfs-rpc-address: "hdfs://namenode-dc1:8020"
        grpc-host: "agent-dc1"
        grpc-port: 50051
        kafka-bootstrap-servers: "${KAFKA_DC1_BOOTSTRAP:kafka-dc1:9092}"
        # Kafka с TLS: протокол клиентов оркестратора (PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL;
        # по умолчанию SASL_PLAINTEXT при Kerberos) и truststore для SSL/SASL_SSL
        # kafka-security-protocol: "SASL_SSL"
        # kafka-service-name: "kafka"
        # kafka-truststore-location: "/etc/security/kafka/truststore.jks"
        # kafka-truststore-password: "${KAFKA_DC1_TRUSTSTORE_PASSWORD:}"
        # kafka-truststore-type: "JKS"
        schema-registry-url: "${SCHEMA_REGISTRY_DC1_URL:http://schema-registry-1:8081}"
        schema-registry-type: "HORTONWORKS"
      - id: "dc2"
        name: "DC2 Disaster Recovery Cluster"
        dc-id: "dc2"
        hdfs-rpc-address: "hdfs://namenode-dc2:8020"
        grpc-host: "agent-dc2"
        grpc-port: 50051
        kafka-bootstrap-servers: "${KAFKA_DC2_BOOTSTRAP:kafka-dc2:9092}"
        schema-registry-url: "${SCHEMA_REGISTRY_DC2_URL:http://schema-registry-2:8082}"
        schema-registry-type: "CONFLUENT"
