[project]
name = "hadoop-explorer-backend"
version = "1.0.0"
description = "Hadoop Explorer Platform Backend Services"
requires-python = ">=3.12"
dependencies = [
    "hadoop-explorer-common",
    "hadoop-explorer-hdfs",
    "hadoop-explorer-sql",
    "hadoop-explorer-yarn",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = [
    "common",
    "hdfs",
    "sql",
    "yarn",
]

[tool.uv.sources]
hadoop-explorer-common = { workspace = true }
hadoop-explorer-hdfs = { workspace = true }
hadoop-explorer-sql = { workspace = true }
hadoop-explorer-yarn = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "hdfs/tests",
    "sql/tests",
    "yarn/tests",
]
pythonpath = [
    ".",
    "..",
    "common",
    "hdfs",
    "sql",
    "yarn",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
    "E501",
    "E402",
    "E712",
    "F401",
    "F841",
    "W293",
]
