syntax = "proto3";

package replicator.control;

option java_multiple_files = true;
option java_package = "org.apache.hadoop.explorer.replicator.generated.control";
option java_outer_classname = "OrchestratorControlPlaneProto";

// Сервис высокопроизводительного управления и координации агентов Оркестратором (Control Plane)
service OrchestratorControlPlaneService {

  // Регистрация агента в реестре оркестратора
  rpc RegisterAgent (AgentRegisterRequest) returns (AgentRegisterResponse);

  // Периодический Heartbeat / Keepalive пинг агента с телеметрией
  rpc Heartbeat (AgentHeartbeatRequest) returns (AgentHeartbeatResponse);

  // Штатное снятие агента с регистрации (Graceful stop -> статус OFFLINE)
  rpc UnregisterAgent (AgentUnregisterRequest) returns (AgentUnregisterResponse);

  // Запрос сетевой квоты полосы пропускания (Hierarchical Token Bucket)
  rpc RequestTokens (TokenRequest) returns (TokenResponse);

  // Пакетная регистрация пула пофайловых задач анализатором или Inotify-стримером
  rpc BatchCreateTasks (BatchCreateTasksRequest) returns (BatchCreateTasksResponse);

  // Атомарный забор порции задач свободным воркером из распределенного пула
  rpc ClaimTasks (ClaimTasksRequest) returns (ClaimTasksResponse);

  // Фиксация успешного выполнения пофайловой задачи воркером
  rpc CompleteTask (CompleteTaskRequest) returns (CompleteTaskResponse);

  // Фиксация ошибки передачи файла воркером с возможностью retry
  rpc FailTask (FailTaskRequest) returns (FailTaskResponse);

  // Обновление прогресса и статуса задания
  rpc UpdateJobProgress (UpdateJobProgressRequest) returns (UpdateJobProgressResponse);

  // Получение активных заданий репликации
  rpc GetJobs (GetJobsRequest) returns (GetJobsResponse);

  // Получение топологии кластеров и адресов агентов
  rpc GetClusters (GetClustersRequest) returns (GetClustersResponse);

  // Продление распределенной аренды Inotify стримера (Active-Standby)
  rpc RenewStreamingLease (StreamingLeaseRenewRequest) returns (StreamingLeaseRenewResponse);

  // Получение ожидающих задач репликации метаданных Hive Metastore
  rpc GetPendingHmsJobs (GetPendingHmsJobsRequest) returns (GetPendingHmsJobsResponse);

  // Отчет о прогрессе репликации метаданных HMS
  rpc ReportHmsProgress (ReportHmsProgressRequest) returns (ReportHmsProgressResponse);

  // Создание дочерней HDFS-подзадачи переноса данных для таблицы HMS
  rpc CreateHdfsSubjob (CreateHdfsSubjobRequest) returns (CreateHdfsSubjobResponse);

  // Получение активных задач репликации Kafka для ДЦ
  rpc GetActiveKafkaJobs (GetActiveKafkaJobsRequest) returns (GetActiveKafkaJobsResponse);
}

// -------------------------------------------------------------
// Регистрация и Heartbeat
// -------------------------------------------------------------

message AgentRegisterRequest {
  string agent_id = 1;
  string cluster_id = 2;
  string mode = 3;
  string advertised_grpc_address = 4;
  string source_address = 5;
  double max_bandwidth_mb_s = 6;
}

message AgentRegisterResponse {
  string status = 1;
  string agent_id = 2;
  string message = 3;
  bool success = 4;
}

message AgentHeartbeatRequest {
  string agent_id = 1;
  string cluster_id = 2;
  string advertised_grpc_address = 3;
  int32 active_transfers = 4;
  string mode = 5;
  int64 transferred_bytes = 6;
  int64 transfer_errors = 7;
  double bandwidth_limit_mb_s = 8;
  int64 compression_raw_bytes = 9;
  int64 compression_compressed_bytes = 10;
  double compression_ratio = 11;
  double chunk_latency_avg_ms = 12;
  double chunk_latency_max_ms = 13;
  int64 chunk_transfer_count = 14;
  int32 staging_active_files = 15;
  int64 staging_active_bytes = 16;
  int64 staging_orphans_cleaned = 17;
  int64 kafka_messages_replicated = 18;
  int64 kafka_bytes_replicated = 19;
  int64 kafka_current_lag_ms = 20;
  // Счетчики по задачам: агент обслуживает несколько задач, и сумма по агенту не говорит,
  // сколько перенесла каждая из них
  repeated KafkaJobStats kafka_job_stats = 21;
  // Агент сообщает счетчики по задачам. Пустой kafka_job_stats у такого агента значит «задач
  // нет», а не «старая версия»: суммарный счетчик агента тогда к задачам не применяется
  bool kafka_job_stats_supported = 22;
  // Задачи, пул которых на агенте не запустился: без этого задача числилась активной, а
  // причина (Kerberos, недоступный брокер, нет приемников) была видна только в логе агента
  repeated KafkaJobError kafka_job_errors = 23;
}

message KafkaJobError {
  string job_id = 1;
  string message = 2;
}

// Телеметрия одной Kafka-задачи на агенте. Счетчики накопительные с момента старта агента
message KafkaJobStats {
  string job_id = 1;
  int64 messages_replicated = 2;
  int64 bytes_replicated = 3;
  int64 lag_ms = 4;
  // Партиции, назначенные пулу задачи на агенте группой консьюмеров: по ним видно, как
  // партиции топиков разложены по агентам и не осталось ли незанятых
  repeated KafkaTopicPartitions assigned_partitions = 5;
}

message KafkaTopicPartitions {
  string topic = 1;
  repeated int32 partitions = 2;
}

message AgentHeartbeatResponse {
  string status = 1;
  bool acknowledged = 2;
}

message AgentUnregisterRequest {
  string agent_id = 1;
}

message AgentUnregisterResponse {
  string status = 1;
  bool success = 2;
}

// -------------------------------------------------------------
// Hierarchical Token Bucket
// -------------------------------------------------------------

message TokenRequest {
  int64 requested_bytes = 1;
  string source_cluster_id = 2;
  string target_cluster_id = 3;
}

message TokenResponse {
  double wait_seconds = 1;
  bool granted = 2;
}

// -------------------------------------------------------------
// Управление задачами (Task Queue)
// -------------------------------------------------------------

message TaskCreateItemProto {
  string source_path = 1;
  string target_path = 2;
  int64 file_size = 3;
  string task_type = 4;
  string manifest_json = 5;
  // File already present on the target with the same size: the task is registered as SKIPPED
  // instead of being copied again (resume and rebootstrap of petabyte schemas)
  bool skipped = 6;
}

message BatchCreateTasksRequest {
  string job_id = 1;
  repeated TaskCreateItemProto tasks = 2;
  int64 epoch = 3;
  int64 last_processed_txid = 4;
  // Large pools are sent in chunks: the first chunk replaces earlier tasks of the job,
  // later chunks (append=true) add to them, and the job starts once the chunk with
  // more_chunks=false arrives. Defaults keep the single-request behaviour of older agents.
  bool append = 5;
  bool more_chunks = 6;
}

message BatchCreateTasksResponse {
  bool success = 1;
  string job_id = 2;
  int32 tasks_count = 3;
  int64 queued_count = 4;
  bool saturated = 5;
  string error = 6;
  bool fenced = 7;
}

message ClaimTasksRequest {
  string worker_id = 1;
  string cluster_id = 2;
  int32 batch_size = 3;
}

message TaskItemProto {
  string task_id = 1;
  string job_id = 2;
  string source_path = 3;
  string target_path = 4;
  int64 file_size = 5;
  string status = 6;
  int32 retry_count = 7;
  string source_cluster_id = 8;
  string target_cluster_id = 9;
  string target_grpc_address = 10;
  string task_type = 11;
  string manifest_json = 12;
  bool run_as_service_account = 13;
  string execution_principal = 14;
  string task_token = 15;
}

message ClaimTasksResponse {
  repeated TaskItemProto tasks = 1;
}

message CompleteTaskRequest {
  string task_id = 1;
  string worker_id = 2;
  int64 bytes_written = 3;
  string message = 4;
  int32 committed_files = 5;
}

message CompleteTaskResponse {
  bool success = 1;
  string message = 2;
}

message FailTaskRequest {
  string task_id = 1;
  string worker_id = 2;
  string error_message = 3;
}

message FailTaskResponse {
  bool success = 1;
  string message = 2;
}

message UpdateJobProgressRequest {
  string job_id = 1;
  string status = 2;
  int64 current_bytes = 3;
  int64 total_bytes = 4;
  string message = 5;
  int64 last_processed_txid = 6;
  int64 txid_lag = 7;
}

message UpdateJobProgressResponse {
  bool success = 1;
  string message = 2;
}

// -------------------------------------------------------------
// Получение заданий и топологии
// -------------------------------------------------------------

message GetJobsRequest {
  bool include_subjobs = 1;
  string cluster_id = 2;
  // Точечная выборка по идентификаторам (ожидание подзадач данных): без нее агенту пришлось бы
  // тянуть весь список заданий кластера, где нужной подзадачи может не оказаться из-за предела
  repeated string job_ids = 3;
  // Отбор по статусу (QUEUED — очередь анализа, STREAMING — потоковые задания); пусто — все.
  // Без него агент получал последние 5000 заданий любых статусов и отбирал нужные у себя:
  // при тысячах подзадач барьера данных QUEUED и компаньоны inotify выпадали из выборки
  string status = 4;
  // Старые первыми: очередь анализа разбирается в порядке создания, а не с конца
  bool oldest_first = 5;
}

message JobItemProto {
  string id = 1;
  string source_cluster_id = 2;
  string target_cluster_id = 3;
  string source_path = 4;
  string target_path = 5;
  string status = 6;
  int64 total_bytes = 7;
  int64 processed_bytes = 8;
  string message = 9;
  string sync_mode = 10;
  string cron_expression = 11;
  string execution_principal = 12;
  bool run_as_service_account = 13;
  string job_type = 14;
  string parent_job_id = 15;
  // Реплицировать удаления с источника (включается оператором для потокового режима)
  bool sync_deletes = 16;
  // Компаньон HMS-задачи удаляет по уровню каталога: каталоги таблиц — только при флажке
  // «Удалять лишние таблицы», все внутри таблиц (партиции, файлы после перезаписи) — только
  // при «Удалять лишние партиции». Для остальных заданий не заполняются
  bool delete_table_dirs = 17;
  bool delete_inside_tables = 18;
}

message GetJobsResponse {
  repeated JobItemProto jobs = 1;
}

message GetClustersRequest {
}

message ClusterItemProto {
  string id = 1;
  string name = 2;
  string dc_id = 3;
  string default_fs = 4;
  string grpc_host = 5;
  int32 grpc_port = 6;
  string grpc_address = 7;
}

message GetClustersResponse {
  repeated ClusterItemProto clusters = 1;
}

// -------------------------------------------------------------
// Inotify Streaming Lease
// -------------------------------------------------------------

message StreamingLeaseRenewRequest {
  string cluster_id = 1;
  string streamer_id = 2;
  string streamer_address = 3;
  int64 processed_txid = 4;
  int64 txid_lag = 5;
  int32 queue_size = 6;
  double queue_saturation_percent = 7;
  bool active = 8;
}

message StreamingLeaseRenewResponse {
  bool granted = 1;
  string leader_id = 2;
  string leader_address = 3;
  int64 lease_duration_ms = 4;
  string cluster_id = 5;
  int64 max_active_txid = 6;
  bool queue_saturated = 7;
}

// -------------------------------------------------------------
// Hive Metastore (HMS) Coordination
// -------------------------------------------------------------

message GetPendingHmsJobsRequest {
  string cluster_id = 1;
  string agent_id = 2;
}

message HmsPendingJobItemProto {
  string job_id = 1;
  string source_cluster = 2;
  string target_cluster = 3;
  string target_agent_grpc_address = 4;
  string source_db = 5;
  string target_db = 6;
  string table_pattern = 7;
  string status = 8;
  bool sync_data = 9;
  string execution_principal = 10;
  int64 last_processed_event_id = 11;
  bool drop_extraneous_tables = 12;
  bool drop_extraneous_partitions = 13;
  string assigned_agent_id = 14;
  bool enable_hdfs_streaming = 15;
  string companion_hdfs_job_id = 16;
  string db_warehouse_location = 17;
  // Продолжение прерванного bootstrap: исходная позиция журнала и чекпоинт (JSON)
  int64 bootstrap_event_id = 18;
  string bootstrap_checkpoint = 19;
}

message GetPendingHmsJobsResponse {
  repeated HmsPendingJobItemProto jobs = 1;
}

message HmsEventReportProto {
  int64 event_id = 1;
  string event_type = 2;
  string table_name = 3;
  string partition_name = 4;
  string source_uri = 5;
  string target_uri = 6;
  string subjob_id = 7;
  string status = 8;
  string error_message = 9;
}

message ReportHmsProgressRequest {
  string job_id = 1;
  string status = 2;
  string message = 3;
  int32 tables_synced = 4;
  int32 partitions_synced = 5;
  int64 last_event_id = 6;
  repeated HmsEventReportProto events = 7;
  int64 bootstrap_event_id = 8;
  int64 event_lag = 9;
  int32 total_tables = 10;
  int32 total_partitions = 11;
  string agent_id = 12;
  string bootstrap_checkpoint = 13;
}

message ReportHmsProgressResponse {
  bool success = 1;
}

message CreateHdfsSubjobRequest {
  string parent_job_id = 1;
  string source_path = 2;
  string target_path = 3;
  string source_cluster = 4;
  string target_cluster = 5;
  string execution_principal = 6;
  string sync_mode = 7;
  string job_type = 8;
  // Агент, заводящий подзадачу: оркестратор принимает ее только от владельца аренды живой
  // HMS-задачи, иначе удаленная или отобранная задача продолжала бы плодить копирования
  string agent_id = 9;
  // Новая подзадача без переиспользования идущей или недавно завершенной: событие INSERT
  // означает новые файлы, а уже прошедшая копия того же каталога их не видела
  bool force_new = 10;
}

message CreateHdfsSubjobResponse {
  string job_id = 1;
  bool success = 2;
  // Отказ по fencing: задача удалена, остановлена или принадлежит другому агенту
  bool fenced = 3;
}

message GetActiveKafkaJobsRequest {
  string dc_id = 1;
}

message KafkaJobItemProto {
  string job_id = 1;
  string name = 2;
  string source_dc = 3;
  string target_dc = 4;
  string direction = 5;
  repeated string topics = 6;
  repeated string consumer_groups = 7;
  string source_bootstrap_servers = 8;
  string target_bootstrap_servers = 9;
  repeated string target_endpoints = 10;
  int32 batch_size = 11;
  int32 consumer_threads = 12;
  double bandwidth_limit_mb = 13;
  string status = 14;
  // Интервал переноса смещений консьюмер-групп задачи, секунды. 0 — перенос выключен
  int32 offset_sync_interval_sec = 15;
  // Транскодинг форматов полезной нагрузки для этой задачи
  bool schema_transcoding = 16;
  // Реестры схем кластеров задачи: берутся из топологии оркестратора, а не из самой задачи
  string source_schema_registry_url = 17;
  string source_schema_registry_type = 18;
  string target_schema_registry_url = 19;
  string target_schema_registry_type = 20;
  // Позиция, с которой новая consumer-группа задачи начинает чтение: LATEST или EARLIEST.
  // Действует только до первого коммита оффсетов группы; пусто — EARLIEST (задачи,
  // созданные до появления поля)
  string start_position = 21;
  // Число живых агентов-отправителей ЦОД этой задачи: агент делит между ними партиции
  // топиков и не заводит консьюмеров больше, чем ему достанется партиций. 0 — неизвестно
  int32 live_senders = 22;
}

message GetActiveKafkaJobsResponse {
  repeated KafkaJobItemProto jobs = 1;
}
