[project]
name = "hadoop-explorer"
version = "1.0.0"
description = "Hadoop Explorer Platform - Unified Enterprise Big Data Web Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hadoop-explorer-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
]

[tool.uv.workspace]
members = [
    "backend/common",
]

[tool.uv.sources]
hadoop-explorer-common = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
pythonpath = [
    ".",
    "backend",
    "backend/common",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "**/__pycache__",
    "dist",
    "build",
    "target",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501",
    "B008",
    "E402",
]
