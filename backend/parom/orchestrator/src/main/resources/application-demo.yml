# Профиль demo: стенды demo/parom и demo/all.
# Вход через OpenLDAP стенда (demo/infra/ldap/bootstrap.ldif), группы — поиском groupOfNames по member.
# debug: true разрешает опубликованный в репозитории JWT-секрет; в продакшене не включать.
# Включение: SPRING_PROFILES_ACTIVE=demo
spring:
  ldap:
    # Иначе LdapHealthIndicator spring-ldap ходит на localhost:389 и /actuator/health отдает 503
    urls: "ldap://ldap:389"
    base: "dc=company,dc=local"
    username: "cn=admin,dc=company,dc=local"
    password: "adminpassword"

zastava:
  debug: true
  auth:
    mode: ldap
  jwt:
    secret-key: "replicator-orchestrator-secret-key-32-chars-minimum!"
  ldap:
    enabled: true
    url: "ldap://ldap:389"
    manager-dn: "cn=admin,dc=company,dc=local"
    manager-password: "adminpassword"
    user-search-base: "ou=users,dc=company,dc=local"
    user-search-filter: "(&(objectClass=inetOrgPerson)(uid={0}))"
    group-search-base: "ou=groups,dc=company,dc=local"
    group-search-filter: "(&(objectClass=groupOfNames)(member={0}))"
