# Базовая конфигурация YARN Explorer, упакованная в JAR.
#
# Значения по умолчанию безопасны для продакшена: без внешнего конфига
# (SPRING_CONFIG_ADDITIONAL_LOCATION) сервис не стартует — нужен собственный
# JWT-секрет, LDAP/Kerberos и список кластеров. Демо-режим (mock) включается
# только явно, см. demo/yarn/application-demo.yml.

server:
  port: 8000
  servlet:
    context-path: /

spring:
  application:
    name: yarn-explorer-java
  datasource:
    url: ${YARN_DB_URL:jdbc:h2:file:./data/yarn_explorer;DB_CLOSE_DELAY=-1}
    driverClassName: ${YARN_DB_DRIVER:org.h2.Driver}
    username: ${YARN_DB_USER:sa}
    password: ${YARN_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

hadoop:
  security:
    debug: false
    auth:
      mode: ${HADOOP_AUTH_MODE:ldap}
    jwt:
      # Обязателен: при пустом значении сервис откажется стартовать
      secret-key: ${JWT_SECRET_KEY:}
      expiration-minutes: 480
    ldap:
      enabled: true
      url: ${LDAP_URL:ldaps://ldap.company.local:636}
      manager-dn: ${LDAP_MANAGER_DN:}
      manager-password: ${LDAP_MANAGER_PASSWORD:}
      user-search-base: ${LDAP_USER_SEARCH_BASE:ou=users,dc=company,dc=local}
      user-search-filter: ${LDAP_USER_SEARCH_FILTER:(uid={0})}

yarn:
  # native — ResourceManager REST API; mock — встроенное демо-дерево (только для стендов)
  client-mode: native
  acl:
    enforce-four-eyes: true
  # Учетная запись Explorer для SPNEGO-запросов к кластерам с kerberos-enabled: true
  kerberos:
    principal: ${YARN_KERBEROS_PRINCIPAL:}
    keytab: ${YARN_KERBEROS_KEYTAB:}
  awx:
    enabled: true
    base-url: ${YARN_AWX_BASE_URL:}
    token: ${YARN_AWX_TOKEN:}
    verify-ssl: true
    default-job-template-id: ${YARN_AWX_JOB_TEMPLATE_ID:101}
    poll-interval-seconds: 2
    timeout-seconds: 180
    simulate: false
  clusters: []
