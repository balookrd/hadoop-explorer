apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sql-explorer.fullname" . }}-config
  labels:
    {{- include "sql-explorer.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      host: {{ .Values.config.server.host | quote }}
      port: {{ .Values.config.server.port }}
      debug: {{ .Values.config.server.debug }}
      {{- if .Values.config.server.cors_origins }}
      cors_origins:
        {{- toYaml .Values.config.server.cors_origins | nindent 8 }}
      {{- end }}
      secure_cookies: {{ .Values.config.server.secure_cookies | default false }}

    database:
      url: {{ .Values.config.database.url | quote }}

    auth:
      mode: {{ .Values.config.auth.mode | quote }}
      ldap:
        enabled: {{ .Values.config.auth.ldap.enabled }}
        server_uri: {{ .Values.config.auth.ldap.server_uri | quote }}
        use_ssl: {{ .Values.config.auth.ldap.use_ssl }}
        bind_dn: {{ .Values.config.auth.ldap.bind_dn | quote }}
        user_base_dn: {{ .Values.config.auth.ldap.user_base_dn | quote }}
        user_filter: {{ .Values.config.auth.ldap.user_filter | quote }}
        user_display_name_attr: {{ .Values.config.auth.ldap.user_display_name_attr | quote }}
        user_email_attr: {{ .Values.config.auth.ldap.user_email_attr | quote }}
        group_base_dn: {{ .Values.config.auth.ldap.group_base_dn | quote }}
        group_filter: {{ .Values.config.auth.ldap.group_filter | quote }}
        group_name_attr: {{ .Values.config.auth.ldap.group_name_attr | quote }}
        ca_cert_file: {{ .Values.config.auth.ldap.ca_cert_file | quote }}
        allow_insecure_ssl: {{ .Values.config.auth.ldap.allow_insecure_ssl | default false }}

      kerberos:
        enabled: {{ .Values.config.auth.kerberos.enabled }}
        keytab_file: {{ .Values.config.auth.kerberos.keytab_file | quote }}
        service_principal: {{ .Values.config.auth.kerberos.service_principal | quote }}

      jwt:
        algorithm: {{ .Values.config.auth.jwt.algorithm | quote }}
        expire_minutes: {{ .Values.config.auth.jwt.expire_minutes }}

    acl:
      ui_access:
        allowed_users:
          {{- toYaml .Values.config.acl.ui_access.allowed_users | nindent 10 }}
        allowed_groups:
          {{- toYaml .Values.config.acl.ui_access.allowed_groups | nindent 10 }}
        admin_groups:
          {{- toYaml .Values.config.acl.ui_access.admin_groups | nindent 10 }}

    clusters:
      {{- toYaml .Values.config.clusters | nindent 6 }}

    query_defaults:
      max_rows_in_ui: {{ .Values.config.query_defaults.max_rows_in_ui }}
      default_limit: {{ .Values.config.query_defaults.default_limit }}
      auto_add_limit: {{ .Values.config.query_defaults.auto_add_limit }}
      query_timeout_seconds: {{ .Values.config.query_defaults.query_timeout_seconds }}

  {{- if .Values.kerberos.enabled }}
  krb5.conf: |
    {{- .Values.kerberos.krb5Conf | nindent 4 }}
  {{- end }}

  {{- if .Values.customLdapCaCert }}
  ldap-ca.crt: |
    {{- .Values.customLdapCaCert | nindent 4 }}
  {{- end }}
