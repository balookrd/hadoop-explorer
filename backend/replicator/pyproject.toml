[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hadoop-explorer-replicator"
version = "1.0.0"
description = "Hadoop gRPC Replicator Service for Hadoop Explorer Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hadoop-explorer-common",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.32",
    "prometheus-client>=0.20.0",
    "pyarrow>=17.0.0",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "worker*", "receiver*", "generated*"]
