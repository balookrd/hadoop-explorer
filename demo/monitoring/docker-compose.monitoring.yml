name: hadoop-explorer-monitoring

services:
  # ==========================================
  # 1. Prometheus Server (Port :9090)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: demo-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - demo-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      demo-platform-net:
        aliases:
          - prometheus
          - prometheus.company.local

  # ==========================================
  # 2. Grafana Dashboard (Port :3000)
  # ==========================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: demo-grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/hadoop_explorer_overview.json
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - demo-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      demo-platform-net:
        aliases:
          - grafana
          - grafana.company.local

volumes:
  demo-prometheus-data:
    name: demo-prometheus-data
  demo-grafana-data:
    name: demo-grafana-data

networks:
  demo-platform-net:
    name: demo-platform-net
    external: true
