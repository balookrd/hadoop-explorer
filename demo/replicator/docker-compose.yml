name: hadoop-replicator-demo

services:
  # 1. Оркестратор задач и Token Bucket Throttler (Java 21 / Spring Boot 3 + Web UI + Prometheus)
  orchestrator:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-orchestrator
    container_name: replicator-orchestrator
    hostname: orchestrator
    restart: unless-stopped
    environment:
      REPLICATOR_GLOBAL_LIMIT_BYTES_PER_SEC: "104857600" # 100 MB/s
      HADOOP_REPLICATOR_AGENT_SECRET: ""
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/replicator;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE"
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    volumes:
      - replicator-db-data:/app/data
    ports:
      - "8005:8005"
    networks:
      - replicator-net

  # 2. Агент DC1 (Primary ЦОД: Москва, dc1 / demo-cluster) — Полный дуплекс
  agent-dc1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-agent-dc1
    hostname: agent-dc1
    restart: unless-stopped
    environment:
      AGENT_ID: "agent-dc1"
      AGENT_CLUSTER_ID: "dc1"
      AGENT_MODE: "all"
      AGENT_MAX_BANDWIDTH_MB_S: "80.0"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      RECEIVER_HOST: "0.0.0.0"
      RECEIVER_PORT: "50051"
      AGENT_ADVERTISED_ADDRESS: "agent-dc1:50051"
      FALLBACK_TARGET_ADDRESS: "agent-dc2:50051"
      REPLICATOR_STAGING_DIR: "/tmp/staging"
      POLL_INTERVAL_SEC: "2.0"
      REPLICATOR_AUTO_CREATE_TEST_DATA: "true"
      REPLICATOR_AGENT_SECRET: ""
    volumes:
      - agent-staging-dc1:/tmp/staging
      - shared-demo-data:/tmp/data
    ports:
      - "50051:50051"
    depends_on:
      - orchestrator
    networks:
      - replicator-net

  # 3. Агент DC2 (DR ЦОД: Санкт-Петербург, dc2 / backup-cluster) — Полный дуплекс
  agent-dc2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-agent-dc2
    hostname: agent-dc2
    restart: unless-stopped
    environment:
      AGENT_ID: "agent-dc2"
      AGENT_CLUSTER_ID: "dc2"
      AGENT_MODE: "all"
      AGENT_MAX_BANDWIDTH_MB_S: "60.0"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      RECEIVER_HOST: "0.0.0.0"
      RECEIVER_PORT: "50051"
      AGENT_ADVERTISED_ADDRESS: "agent-dc2:50051"
      FALLBACK_TARGET_ADDRESS: "agent-dc1:50051"
      REPLICATOR_STAGING_DIR: "/tmp/staging"
      POLL_INTERVAL_SEC: "2.0"
      REPLICATOR_AUTO_CREATE_TEST_DATA: "true"
      REPLICATOR_AGENT_SECRET: ""
    volumes:
      - agent-staging-dc2:/tmp/staging
      - shared-demo-data:/tmp/data
    ports:
      - "50052:50051"
    depends_on:
      - orchestrator
    networks:
      - replicator-net

volumes:
  replicator-db-data:
  agent-staging-dc1:
  agent-staging-dc2:
  shared-demo-data:

networks:
  replicator-net:
    driver: bridge
