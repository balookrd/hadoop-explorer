global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'pristan'
    # Spring Boot Actuator scrape endpoint, public on the application port
    # (docs/CONFIGURATION.md, section 9). Ports: SERVER_PORT in docker/Dockerfile.*
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets:
          - 'artel:8000'
          - 'sklad:8000'
          - 'tolmach:8003'
          - 'iskra:8004'
        labels:
          env: 'production'

  - job_name: 'parom'
    # GET /metrics needs authentication: HTTP Basic prometheus:<PAROM_METRICS_SCRAPE_TOKEN>
    metrics_path: '/metrics'
    scrape_interval: 5s
    honor_labels: true
    basic_auth:
      username: 'prometheus'
      password_file: '/etc/prometheus/secrets/parom-metrics-scrape-token'
    static_configs:
      - targets:
          - 'parom-orchestrator:8005'
          - 'localhost:8005'
        labels:
          app: 'parom'
          env: 'production'
