apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spark-explorer.fullname" . }}
  labels:
    {{- include "spark-explorer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  {{- /* A file-backed database (SQLite, embedded H2) cannot be shared by several pods.
         The "jdbc:" prefix is stripped so that jdbc:sqlite:... and jdbc:h2:file:... URLs
         (docs/CONFIGURATION.md, docs/production-database.md) are caught as well;
         H2 in server mode (jdbc:h2:tcp://, jdbc:h2:ssl://) is shared and is not limited. */ -}}
  {{- $dbUrl := .Values.config.database.url | default "" | lower | trimPrefix "jdbc:" -}}
  {{- $h2Embedded := and (hasPrefix "h2:" $dbUrl) (not (hasPrefix "h2:tcp:" $dbUrl)) (not (hasPrefix "h2:ssl:" $dbUrl)) -}}
  {{- if and (or (eq $dbUrl "") (hasPrefix "sqlite" $dbUrl) $h2Embedded) (gt (.Values.replicaCount | int) 1) }}
  replicas: 1
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spark-explorer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "spark-explorer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spark-explorer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/etc/spark-explorer/config.yaml"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-explorer.fullname" . }}-secrets
                  key: jwt-secret
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-explorer.fullname" . }}-secrets
                  key: ldap-password
            {{- if .Values.secrets.databasePassword }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-explorer.fullname" . }}-secrets
                  key: database-password
            {{- end }}
            {{- if .Values.config.auth.kerberos.service_principal }}
            - name: KRB5_PRINCIPAL
              value: {{ .Values.config.auth.kerberos.service_principal | quote }}
            {{- end }}
            {{- if .Values.config.auth.kerberos.keytab_file }}
            - name: KRB5_KEYTAB
              value: {{ .Values.config.auth.kerberos.keytab_file | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: app-config
              mountPath: /etc/spark-explorer/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.kerberos.enabled }}
            - name: app-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            {{- end }}
            {{- if .Values.customLdapCaCert }}
            - name: app-config
              mountPath: /etc/ssl/certs/ldap-ca.crt
              subPath: ldap-ca.crt
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.kerberosKeytabBase64 }}
            - name: keytab-volume
              mountPath: /etc/security/keytabs
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath | default "/app/data" }}
            {{- end }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "spark-explorer.fullname" . }}-config
        {{- if .Values.secrets.kerberosKeytabBase64 }}
        - name: keytab-volume
          secret:
            secretName: {{ include "spark-explorer.fullname" . }}-secrets
            items:
              - key: spark-explorer.keytab
                path: spark-explorer.keytab
                mode: 0400
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "spark-explorer.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
