server:
  port: 8004

spring:
  application:
    name: hadoop-spark-explorer
  datasource:
    url: jdbc:h2:mem:sparkexplorer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    property-naming-strategy: SNAKE_CASE

hadoop:
  security:
    debug: true
    auth:
      mode: mock
      admin-groups:
        - "hadoop-admins"
        - "platform-admins"
        - "superusers"
      writer-groups:
        - "data-engineers"
        - "developers"
    jwt:
      secret-key: "spark-explorer-super-secret-jwt-token-key-32-chars-min!"
      expiration-minutes: 480
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:8004"
    cookie:
      secure: false
      same-site: "Lax"
      names:
        - "access_token"
        - "spark_explorer_session"
        - "hadoop_explorer_session"

spark:
  session-ttl-minutes: 120
  results-ttl-hours: 24
  clusters:
    - id: "prod-analytics"
      name: "Production Analytics (Livy)"
      description: "Основной кластер для расчетов PySpark и Spark SQL"
      type: "livy"
      livy-url: "http://livy.prod.corp:8998"
      yarn-cluster-id: "yarn-prod"
      mock-storage: true
      yarn-queues:
        - "root.default"
        - "root.analytics"
        - "root.engineering"
      default-queue: "root.analytics"
      spark-versions:
        - id: "spark-3.5.1"
          name: "Apache Spark 3.5.1"
          default-version: true
          python-versions:
            - id: "py310"
              name: "Python 3.10 (DataScience Stack)"
              default-env: true
            - id: "py311"
              name: "Python 3.11 (Minimal)"
              default-env: false
      metastores:
        - id: "hive-prod"
          name: "Production Hive Metastore"
          default-metastore: true
      resource-profiles:
        - id: "small"
          name: "Small (1 executor, 2G)"
          driver-memory: "1g"
          driver-cores: 1
          executor-memory: "2g"
          executor-cores: 1
          num-executors: 1
        - id: "medium"
          name: "Medium (2 executors, 4G)"
          driver-memory: "2g"
          driver-cores: 1
          executor-memory: "4g"
          executor-cores: 2
          num-executors: 2
