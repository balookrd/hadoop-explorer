id: no-synchronized-on-io-path
message: "Монитор вокруг сетевого или файлового вызова: под виртуальными потоками Java 21 он пиннит несущий поток. Используйте ReentrantLock."
severity: error
language: java
files:
  - "backend/replicator/agent/src/main/java/io/github/balookrd/pristan/replicator/inotify/InotifyBatchProcessor.java"
  - "backend/replicator/agent/src/main/java/io/github/balookrd/pristan/replicator/kafka/security/KerberosSpnegoAuthenticator.java"
  - "backend/replicator/agent/src/main/java/io/github/balookrd/pristan/replicator/sender/ReplicationSender.java"
  - "backend/replicator/agent/src/main/java/io/github/balookrd/pristan/replicator/client/OrchestratorGrpcClient.java"
rule:
  any:
    - pattern: synchronized ($LOCK) { $$$BODY }
    - kind: modifiers
      regex: "\\bsynchronized\\b"
