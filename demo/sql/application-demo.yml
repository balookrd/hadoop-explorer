server:
  port: 8003

spring:
  application:
    name: sql-explorer-demo
  datasource:
    url: jdbc:h2:file:/app/data/sql_explorer;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

hadoop:
  security:
    debug: true
    auth:
      mode: hybrid
      admin-groups:
        - "data-platform-admins"
        - "hadoop-admins"
      writer-groups:
        - "data-engineers"
    jwt:
      secret-key: "demo-jwt-secret-key-change-in-production-only-min-32-chars!"
      expiration-minutes: 480
    mock-users:
      - username: "admin_user"
        password: "password123"
        displayName: "Администратор Системы"
        email: "admin@company.local"
        groups: ["data-platform-admins", "data-engineers"]
      - username: "de_user"
        password: "password123"
        displayName: "Иван Датаинженеров"
        email: "de@company.local"
        groups: ["data-engineers", "bi-analysts"]
      - username: "analyst_user"
        password: "password123"
        displayName: "Анна Аналитикова"
        email: "analyst@company.local"
        groups: ["bi-analysts"]
    ldap:
      enabled: true
      server-uri: "ldap://ldap:389"
      bind-dn: "cn=admin,dc=company,dc=local"
      bind-password: "adminpassword"
      user-base-dn: "ou=users,dc=company,dc=local"
      user-filter: "(|(uid={username})(cn={username}))"
      group-base-dn: "ou=groups,dc=company,dc=local"
      group-filter: "(&(objectClass=groupOfNames)(member={user_dn}))"
    kerberos:
      enabled: true
      keytab-file: "/etc/security/keytabs/sql-explorer.keytab"
      service-principal: "HTTP/sql-explorer@COMPANY.LOCAL"
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:8003"
    cookie:
      secure: false

sql:
  results-ttl-hours: 24
  max-rows-per-query: 10000
  default-page-size: 500
  ai:
    enabled: true
    url: "http://host.docker.internal:11434/v1"
    model: "qwen2.5-coder:7b"
    provider: "openai_compatible"
  clusters:
    - id: "trino-kerberized"
      name: "Trino Cluster (Kerberos + X-Trino-User)"
      type: "trino"
      host: "trino-coordinator"
      port: 8443
      catalog: "tpch"
      schema: "sf1"
      mock-storage: false
      impersonation:
        enabled: true
        method: "x-trino-user"
      allowed-groups:
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
    - id: "hive-kerberized-de"
      name: "Hive Server (DE Only - Kerberos + doAs)"
      type: "hive"
      host: "hive-server"
      port: 10000
      catalog: "default"
      schema: "default"
      mock-storage: false
      impersonation:
        enabled: true
        method: "doAs"
      allowed-groups:
        - "data-engineers"
        - "data-platform-admins"
    - id: "hive-demo-analytics"
      name: "Hive Server 1 (Production Lakehouse - All Roles)"
      type: "hive"
      host: "hive-server"
      port: 10000
      catalog: "default"
      schema: "demo_db"
      mock-storage: false
      impersonation:
        enabled: true
        method: "doAs"
      allowed-groups:
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
    - id: "hive-archive-analytics"
      name: "Hive Server 2 (Archive DataLake - All Roles)"
      type: "hive"
      host: "hive-server-2"
      port: 10001
      catalog: "default"
      schema: "archive_db"
      mock-storage: false
      impersonation:
        enabled: true
        method: "doAs"
      allowed-groups:
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
