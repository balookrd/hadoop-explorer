name: sql-explorer-demo

include:
  # Hive Metastore and HiveServer2 keep their warehouse in hdfs-cluster-1/2
  - path: ../platform/docker-compose.hdfs.yml
  - path: ../platform/docker-compose.hms.yml

volumes:
  sql-explorer-data:
    name: sql-explorer-data

services:
  # HiveServer2 (Cluster 1 и Cluster 2) и Hive Metastore подключены через ../platform/docker-compose.hms.yml

  # ==========================================
  # 2. Trino Coordinator (Kerberized + TPCH + Hive)
  # ==========================================
  sql-trino-coordinator:
    image: trinodb/trino:484
    container_name: trino-coordinator
    hostname: trino-coordinator
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./hive/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
      - ./hive/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
      - ./hive/core-site-cluster2.xml:/etc/hadoop/conf/core-site-cluster2.xml:ro
      - ./hive/hdfs-site-cluster2.xml:/etc/hadoop/conf/hdfs-site-cluster2.xml:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
    depends_on:
      - kdc
      - sql-hive-metastore
    networks:
      demo-platform-net:
        aliases:
          - trino-coordinator

  # ==========================================
  # 3. Сервис SQL Explorer (Java 21 / Spring Boot 3 + Web UI)
  # ==========================================
  sql-explorer:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sql-java
    container_name: sql-explorer
    hostname: sql-explorer
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/app/config/application.yml
      - FRONTEND_DIST=/app/frontend/dist
      - KRB5_CONFIG=/etc/security/keytabs/krb5-nocanon.conf
      - JAVA_TOOL_OPTIONS=-Djava.security.krb5.conf=/etc/security/keytabs/krb5-nocanon.conf
    volumes:
      - ./application-demo.yml:/app/config/application.yml:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
      # TLS certificate of the coordinator, used as truststore by trino-jdbc (SSLVerification=CA)
      - ./trino/etc/keystore.jks:/etc/sql-explorer/trino-truststore.jks:ro
      - sql-explorer-data:/app/data
    depends_on:
      kdc:
        condition: service_healthy
      ldap:
        condition: service_healthy
      sql-hive-server:
        condition: service_started
      sql-hive-server-2:
        condition: service_started
      sql-trino-coordinator:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - demo-platform-net
