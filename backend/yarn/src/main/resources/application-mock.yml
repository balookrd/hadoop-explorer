# Профиль mock: локальная разработка без кластера. Демо-учетки без проверки в каталоге,
# фиктивные очереди и симуляция AWX — никогда не включать в продакшене.
# Включение: SPRING_PROFILES_ACTIVE=mock
# Настройки общего стартера безопасности платформы
hadoop:
  security:
    debug: true
    auth:
      mode: mock
    jwt:
      secret-key: "yarn-explorer-test-secret-key-at-least-32-characters"
      expiration-minutes: 480
    mock-users:
      - username: "admin_user"
        password: "password123"
        displayName: "Александр Админов"
        email: "admin@company.local"
        groups: ["hadoop-admins", "platform-team"]
      - username: "writer_user"
        password: "password123"
        displayName: "Владимир Инженеров"
        email: "writer@company.local"
        groups: ["yarn-operators", "dev-leads"]
      - username: "reader_user"
        password: "password123"
        displayName: "Екатерина Наблюдателева"
        email: "reader@company.local"
        groups: ["bi-analysts", "junior-devs"]
    rate-limiter:
      enabled: false

# Модуль YARN: встроенное демо-дерево очередей вместо RM и симуляция AWX
yarn:
  client-mode: mock
  acl:
    enforce-four-eyes: true
  awx:
    enabled: true
    base-url: "https://awx.company.local"
    token: "SampleAwxApplicationTokenHere"
    verify-ssl: true
    default-job-template-id: 101
    poll-interval-seconds: 2
    timeout-seconds: 180
    simulate: true
  clusters:
    - id: "prod-yarn"
      name: "Production Hadoop Cluster"
      description: "Основной производственный YARN кластер (HDP/CDP, 120 узлов)"
      resource-manager-urls:
        - "http://rm1.prod.company.local:8088"
        - "http://rm2.prod.company.local:8088"
      kerberos-enabled: true
      kerberos-principal: "yarn/rm1.prod.company.local@COMPANY.LOCAL"
      impersonation-enabled: true
      default-partition: "DEFAULT"
      partitions: ["DEFAULT", "GPU", "HIGH_MEM"]
      resource-mode: "percentage"
      queue-mappings: "u:%user:%user"
      queue-mappings-override: false
      total-resources:
        memory-mb: 2097152
        vcores: 1024
      awx:
        enabled: true
        job-template-id: 101
      acl:
        allowed-users: ["*"]
        allowed-groups: ["*"]
        roles:
          admin:
            users: ["admin_user"]
            groups: ["hadoop-admins"]
          writer:
            users: ["writer_user"]
            groups: ["yarn-operators"]
          reader:
            users: ["*"]
            groups: ["*"]

    - id: "analytics-yarn"
      name: "Analytics & ML Cluster"
      description: "Кластер для Spark, Trino и GPU расчетов"
      resource-manager-urls:
        - "http://rm1.analytics.company.local:8088"
      kerberos-enabled: false
      impersonation-enabled: true
      default-partition: "DEFAULT"
      partitions: ["DEFAULT", "GPU"]
      resource-mode: "percentage"
      total-resources:
        memory-mb: 1048576
        vcores: 512
      acl:
        allowed-users: ["*"]
        allowed-groups: ["*"]
        roles:
          admin:
            users: ["admin_user"]
            groups: ["hadoop-admins"]
          writer:
            users: ["writer_user"]
            groups: ["yarn-operators"]
          reader:
            users: ["*"]
            groups: ["*"]
