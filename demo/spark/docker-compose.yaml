name: spark-explorer-demo

include:
  - path: ../platform/docker-compose.core.yml

volumes:
  spark-demo-data:
    name: spark-demo-data

services:
  # ==========================================
  # 1. Apache Livy Server + Apache Spark 3.5
  # ==========================================
  spark-livy:
    build:
      context: ./livy
    container_name: spark-livy-1
    hostname: spark-livy
    restart: unless-stopped
    environment:
      SPARK_MASTER: "local[*]" # Для быстрого интерактивного отклика контейнеров demo
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-1:9000"
      HDFS_NN_PRINCIPAL: "nn/hdfs-cluster-1.demo-platform-net@COMPANY.LOCAL"
      HIVE_SERVER_PRINCIPAL: "hive/hive-server@COMPANY.LOCAL"
      HIVE_METASTORE_URIS: "thrift://hive-metastore-1:9083"
      HIVE_METASTORE_PRINCIPAL: "hive/hive-metastore@COMPANY.LOCAL"
    ports:
      - "8998:8998"
    volumes:
      - ./livy/entrypoint.sh:/entrypoint.sh
      - demo-shared-krb5:/shared/conf:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
    networks:
      demo-platform-net:
        aliases:
          - spark-livy
          - spark-livy-1
    depends_on:
      hdfs-cluster-1:
        condition: service_started
      yarn-demo-rm-1:
        condition: service_started
      sql-hive-metastore:
        condition: service_started

  # ==========================================
  # 1b. Apache Livy Server 2 (Cluster 2 - Archive)
  # ==========================================
  spark-livy-2:
    build:
      context: ./livy
    container_name: spark-livy-2
    hostname: spark-livy-2
    restart: unless-stopped
    environment:
      SPARK_MASTER: "local[*]"
      LIVY_PORT: "8999"
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-2:9000"
      HDFS_NN_PRINCIPAL: "nn/hdfs-cluster-2.demo-platform-net@COMPANY.LOCAL"
      HIVE_SERVER_PRINCIPAL: "hive/hive-server-2.demo-platform-net@COMPANY.LOCAL"
      HIVE_METASTORE_URIS: "thrift://hive-metastore-2:9083"
      HIVE_METASTORE_PRINCIPAL: "hive/hive-metastore-2.demo-platform-net@COMPANY.LOCAL"
    ports:
      - "8999:8999"
    volumes:
      - ./livy/entrypoint.sh:/entrypoint.sh
      - demo-shared-krb5:/shared/conf:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
    networks:
      demo-platform-net:
        aliases:
          - spark-livy-2
    depends_on:
      hdfs-cluster-2:
        condition: service_started
      sql-hive-metastore-2:
        condition: service_started

  # ==========================================
  # 2. Spark Explorer (Java 21 / Spring Boot 3 + Web UI)
  # ==========================================
  spark-explorer:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.spark-java
    container_name: spark-explorer
    hostname: spark-explorer
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/app/config/application.yml
      - FRONTEND_DIST=/app/frontend/dist
      - KRB5_CONFIG=/etc/krb5_shared/krb5.conf
      - JAVA_TOOL_OPTIONS=-Djava.security.krb5.conf=/etc/krb5_shared/krb5.conf
    volumes:
      - ./application-demo.yml:/app/config/application.yml:ro
      - spark-demo-data:/app/data
      - demo-shared-krb5:/etc/krb5_shared:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
    networks:
      demo-platform-net:
        aliases:
          - spark-explorer
    depends_on:
      spark-livy:
        condition: service_started
      spark-livy-2:
        condition: service_started
      ldap:
        condition: service_healthy
