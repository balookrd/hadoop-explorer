clusters:
  - id: "prod-datalake"
    name: "Production DataLake"
    description: "Основной аналитический кластер HDFS"
    # Поддержка нескольких NameNode для High Availability (failover)
    webhdfs_urls:
      - "http://nn01.prod.example.com:9870/webhdfs/v1"
      - "http://nn02.prod.example.com:9870/webhdfs/v1"
    # Тип аутентификации бэкенда к WebHDFS: kerberos или simple
    auth_type: "kerberos"
    service_principal: "hdfs-explorer/hdfs-explorer.prod.example.com@EXAMPLE.COM"
    keytab_path: "/etc/security/keytabs/hdfs-explorer.keytab"
    # Дополнительные заголовки/параметры
    timeout_seconds: 30
    preview_max_bytes: 1048576  # 1 MB для предпросмотра
    default_path: "/user/{username}"
    acl:
      # Кто может видеть этот кластер в списке и работать с ним
      allowed_groups:
        - "data-engineers"
        - "analytics"
        - "hadoop-admins"
      allowed_users: []
      # Группы только для чтения (запрещены операции upload, delete, mkdir, rename на уровне UI)
      read_only_groups:
        - "analytics"
      # Администраторы кластера
      admin_groups:
        - "hadoop-admins"

  - id: "dev-cluster"
    name: "Development Cluster"
    description: "Кластер для разработки и тестирования пайплайнов"
    webhdfs_urls:
      - "http://nn01.dev.example.com:9870/webhdfs/v1"
    auth_type: "simple"  # для простого дев-кластера без kerberos
    timeout_seconds: 20
    preview_max_bytes: 2097152
    default_path: "/tmp"
    acl:
      allowed_groups:
        - "domain users"
        - "developers"
      allowed_users: []
      read_only_groups: []
      admin_groups:
        - "hadoop-admins"
