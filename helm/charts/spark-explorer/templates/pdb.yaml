{{- if or (and .Values.podDisruptionBudget .Values.podDisruptionBudget.enabled) (gt (.Values.replicaCount | int) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "spark-explorer.fullname" . }}
  labels:
    {{- include "spark-explorer.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spark-explorer.selectorLabels" . | nindent 6 }}
{{- end }}
