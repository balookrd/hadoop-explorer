groups:
  - name: hadoop_explorer_alerts
    rules:
      - alert: HadoopHigh5xxErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator/.*"}[1m])) by (app) / sum(rate(http_server_requests_seconds_count{uri!~"/actuator/.*"}[1m])) by (app)) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Высокая доля ошибок 5xx в сервисе {{ $labels.app }}"
          description: "Более 5% запросов к {{ $labels.app }} завершаются кодами 5xx в течение 1 минуты."

      - alert: HadoopHighApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{uri!~"/actuator/.*"}[5m])) by (le, app)) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка API p95 в сервисе {{ $labels.app }}"
          description: "95-й перцентиль задержки ответов {{ $labels.app }} превышает 2 секунды."

      - alert: HadoopLoginRateLimitSpike
        # Login limit is 30/min per client IP: a slow password guess at ~1.5 rps from one IP
        # gives ~1 rejection/s, so 0.2/s (about 60 rejections in 5 minutes) is already abnormal
        expr: sum by (app) (rate(hadoop_rate_limit_blocks_total{tier="login"}[5m])) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ограничитель частоты отклоняет входы в {{ $labels.app }}"
          description: "Ответов 429 на /api/v1/auth/login и /api/v1/auth/sso в {{ $labels.app }} больше 0,2 в секунду (среднее за 5 минут) в течение 2 минут: возможен перебор паролей или много пользователей за одним IP."

      - alert: HadoopApiRateLimitSpike
        # Normal UI traffic stays far below the API limit (600/min, burst 100 per user),
        # so a sustained 1 rejection/s means a script or clients stuck behind one IP
        expr: sum by (app) (rate(hadoop_rate_limit_blocks_total{tier="api"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ограничитель частоты отклоняет запросы к API в {{ $labels.app }}"
          description: "Ответов 429 на запросы к API в {{ $labels.app }} больше 1 в секунду (среднее за 5 минут) в течение 2 минут."

      - alert: HdfsOperationsHighFailureRate
        expr: (sum(rate(hdfs_operations_total{status="failed"}[5m])) by (cluster) / sum(rate(hdfs_operations_total[5m])) by (cluster)) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая доля ошибок операций HDFS на кластере {{ $labels.cluster }}"
          description: "Более 10% операций с файлами HDFS на кластере {{ $labels.cluster }} завершаются ошибками."

      - alert: ReplicationHighThrottlingDelay
        expr: rate(replicator_throttling_delay_seconds_total[2m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка шейпера полосы в Hadoop gRPC Replicator"
          description: "Воркеры ожидают квоты более 5 секунд в секунду из-за достижения лимита полосы WAN или ЦОД."

      - alert: ReplicationJobsHighFailureRate
        # replicator_jobs_total is a gauge of jobs per status, so this is the share of FAILED jobs, not a rate
        expr: sum(replicator_jobs_total{status="FAILED"}) / sum(replicator_jobs_total{status=~"QUEUED|RUNNING|COMPLETED|FAILED"}) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Высокая доля сбоев задач репликации"
          description: "Более 10% задач репликации HDFS находятся в статусе FAILED."

      - alert: ReplicationWorkerStarvation
        expr: replicator_active_workers == 0 and on() sum(replicator_jobs_total{status=~"RUNNING|QUEUED"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Отсутствуют активные воркеры при наличии задач репликации"
          description: "В очереди находятся задачи репликации, но ни один воркер gRPC не выполняет передачу."

      - alert: KafkaReplicationHighLag
        expr: kafka_current_lag_ms > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Высокий сквозной лаг репликации Kafka (> 1 с)"
          description: "Сквозной лаг потоковой репликации Kafka (kafka_current_lag_ms) превышает 1000 мс в течение 1 минуты."

      - alert: KafkaReplicationCriticalLag
        expr: kafka_current_lag_ms > 5000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Критический сквозной лаг репликации Kafka (> 5 с)"
          description: "Сквозной лаг потоковой репликации Kafka превышает 5000 мс в течение 2 минут. Возможна задержка данных в целевом кластере."

      - alert: KafkaReplicationJobPaused
        expr: replicator_kafka_jobs_total{status="PAUSED"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Приостановлена задача потоковой репликации Kafka"
          description: "Одна или несколько задач репликации Kafka находятся в статусе PAUSED более 5 минут."

