[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hadoop-explorer-sql"
version = "1.0.0"
description = "SQL Explorer Service (Trino & Hive) for Hadoop Explorer Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hadoop-explorer-common",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "requests-kerberos>=0.14.0",
    "kerberos>=1.3.0",
    "trino>=0.329.0",
    "impyla>=0.24.0",
    "thrift>=0.16.0",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6.2",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "sqlglot>=30.0.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
