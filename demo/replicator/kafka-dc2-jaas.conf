KafkaServer {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    keyTab="/etc/security/keytabs/kafka-cluster-2.keytab"
    principal="kafka/kafka-cluster-2.demo-platform-net@COMPANY.LOCAL";
};

KafkaClient {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    keyTab="/etc/security/keytabs/kafka-cluster-2.keytab"
    principal="kafka/kafka-cluster-2.demo-platform-net@COMPANY.LOCAL";
};



