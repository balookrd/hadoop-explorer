name: hdfs-explorer-demo

include:
  - path: ../infra/docker-compose.infra.yml

volumes:
  hdfs-demo-data:
    name: hdfs-demo-data

services:
  hdfs-cluster-1:
    build:
      context: ./hadoop
    container_name: hdfs-demo-cluster-1
    hostname: hdfs-cluster-1
    restart: unless-stopped
    environment:
      CLUSTER_ID: "hdfs-cluster-1"
      CLUSTER_NAME: "Production DataLake"
    volumes:
      - demo-shared-keytabs:/shared/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "9870:9870"
      - "9864:9864"
    depends_on:
      kdc:
        condition: service_healthy
    networks:
      - demo-platform-net

  hdfs-cluster-2:
    build:
      context: ./hadoop
    container_name: hdfs-demo-cluster-2
    hostname: hdfs-cluster-2
    restart: unless-stopped
    environment:
      CLUSTER_ID: "hdfs-cluster-2"
      CLUSTER_NAME: "Archive & Analytics DataLake"
    volumes:
      - demo-shared-keytabs:/shared/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "9872:9870"
      - "9865:9864"
    depends_on:
      kdc:
        condition: service_healthy
    networks:
      - demo-platform-net

  hdfs-explorer:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.hdfs
    container_name: hdfs-demo-explorer
    hostname: hdfs-explorer
    restart: unless-stopped
    environment:
      HDFS_CONFIG_PATH: "/app/config/config.yaml"
      HDFS_CLUSTERS_PATH: "/app/config/clusters.yaml"
      HDFS_DATABASE_URL: "sqlite:////app/data/hdfs_explorer.db"
      KRB5_CONFIG: "/etc/krb5_shared/krb5.conf"
    volumes:
      - ./config:/app/config:ro
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/etc/krb5_shared:ro
      - hdfs-demo-data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      kdc:
        condition: service_healthy
      ldap:
        condition: service_healthy
      hdfs-cluster-1:
        condition: service_started
      hdfs-cluster-2:
        condition: service_started
    networks:
      - demo-platform-net

