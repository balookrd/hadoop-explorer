{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spark-explorer.fullname" . }}
  labels:
    {{- include "spark-explorer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spark-explorer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
      {{- if .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDns }}
    # DNS queries (TCP and UDP)
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowKerberos }}
    # Kerberos KDC
    - to: []
      ports:
        - protocol: UDP
          port: 88
        - protocol: TCP
          port: 88
        - protocol: TCP
          port: 749
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowLdap }}
    # LDAP and LDAPS
    - to: []
      ports:
        - protocol: TCP
          port: 389
        - protocol: TCP
          port: 636
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowLivy }}
    # Apache Livy REST API
    - to: []
      ports:
        - protocol: TCP
          port: 8998
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowYarn }}
    # YARN ResourceManagers
    - to: []
      ports:
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8090
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowHiveMetastore }}
    # Hive Metastore Thrift API
    - to: []
      ports:
        - protocol: TCP
          port: 9083
    {{- end }}
{{- end }}
