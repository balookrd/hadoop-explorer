# Количество реплик. Внимание: при использовании локальной SQLite БД поддерживается только 1 реплика (replicaCount: 1).
# Для запуска 2 и более реплик настройте внешний PostgreSQL (config.database.url: postgresql+asyncpg://...).
# Подробное руководство по переходу см. в docs/production-database.md
replicaCount: 1

image:
  repository: spark-explorer
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  # Port the application listens on: SERVER_PORT=8004 in docker/Dockerfile.spark-java and
  # server.port in backend/spark/src/main/resources/application.yml. Also used as the
  # containerPort and as the NetworkPolicy ingress port.
  targetPort: 8004

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
  hosts:
    - host: spark-explorer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: spark-explorer-tls
      hosts:
        - spark-explorer.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Spring Boot readiness group (management.endpoint.health.probes.enabled in the service's
# application.yml): UP after ApplicationReadyEvent, OUT_OF_SERVICE (HTTP 503) once the
# application context starts closing.
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Персистентное хранилище (используется при локальной SQLite БД)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

# Конфигурация приложения
config:
  server:
    host: "0.0.0.0"
    port: 8004
    debug: false
    cors_origins:
      - "https://spark-explorer.example.com"
    secure_cookies: true

  database:
    # SQLite по умолчанию: "sqlite+aiosqlite:////app/data/spark_explorer.db"
    # Для внешнего PostgreSQL: "postgresql+asyncpg://user:pass@postgres-host:5432/spark_explorer"
    url: "sqlite+aiosqlite:////app/data/spark_explorer.db"

  auth:
    mode: "hybrid"
    ldap:
      enabled: true
      server_uri: "ldaps://ad.example.com:636"
      use_ssl: true
      bind_dn: "cn=svc_spark_explorer,ou=services,dc=example,dc=com"
      user_base_dn: "ou=users,dc=example,dc=com"
      user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
      user_display_name_attr: "displayName"
      user_email_attr: "mail"
      group_base_dn: "ou=groups,dc=example,dc=com"
      group_filter: "(&(objectClass=group)(member={user_dn}))"
      group_name_attr: "cn"
      ca_cert_file: "/etc/ssl/certs/ldap-ca.crt"
      allow_insecure_ssl: false

    kerberos:
      enabled: true
      keytab_file: "/etc/security/keytabs/spark-explorer.keytab"
      service_principal: "HTTP/spark-explorer.example.com@EXAMPLE.COM"

    jwt:
      algorithm: "HS256"
      expire_minutes: 480

  acl:
    ui_access:
      allowed_users:
        - "*"
      allowed_groups:
        - "domain users"
        - "data-engineers"
        - "bi-analysts"
        - "hadoop-admins"
        - "platform-admins"
      admin_groups:
        - "hadoop-admins"
        - "platform-admins"

  # Конфигурация кластеров Spark
  clusters:
    - id: "prod-hadoop"
      name: "Production Hadoop (Spark & Livy)"
      type: "spark"
      livy_url: "http://livy-prod.example.com:8998"
      use_ssl: false
      auth:
        type: "kerberos"
        service_name: "livy"
      impersonation:
        enabled: true
        method: "proxyUser"
      acl:
        allowed_groups:
          - "*"
        allowed_users: []

# Секреты
secrets:
  jwtSecret: "replace-with-a-very-long-random-string-in-production"
  ldapBindPassword: "YourLdapServiceAccountPassword"
  databasePassword: ""
  kerberosKeytabBase64: ""

# Настройка /etc/krb5.conf
kerberos:
  enabled: true
  krb5Conf: |
    [libdefaults]
        default_realm = EXAMPLE.COM
        dns_lookup_realm = false
        dns_lookup_kdc = true
        ticket_lifetime = 24h
        renew_lifetime = 7d
        forwardable = true

    [realms]
        EXAMPLE.COM = {
            kdc = kdc.example.com:88
            admin_server = kdc.example.com:749
        }

    [domain_realm]
        .example.com = EXAMPLE.COM
        example.com = EXAMPLE.COM

# Дополнительный сертификат CA для проверки LDAPS
customLdapCaCert: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Настройка сетевых политик Kubernetes NetworkPolicy
networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
  egress:
    allowDns: true
    allowKerberos: true
    allowLdap: true
    allowLivy: true
    allowYarn: true
    allowHiveMetastore: true

# PodDisruptionBudget для защиты от сбоев при drain нод Kubernetes
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: ""

