server:
  port: 8000

spring:
  application:
    name: artel-demo
  datasource:
    url: jdbc:h2:file:/app/data/artel;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

zastava:
  debug: true
  auth:
    mode: ldap
    writer-groups:
      - "artel-operators"
      - "data-engineers"
      - "dev-leads"
      - "spark-users"
  jwt:
    secret-key: "yarn-explorer-demo-stand-super-secret-key-2026"
    expiration-minutes: 480
  ldap:
    enabled: true
    url: "ldap://ldap:389"
    manager-dn: "cn=admin,dc=company,dc=local"
    manager-password: "adminpassword"
    user-search-base: "ou=users,dc=company,dc=local"
    user-search-filter: "(&(objectClass=inetOrgPerson)(|(uid={0})(cn={0})))"
    group-search-base: "ou=groups,dc=company,dc=local"
    group-search-filter: "(&(objectClass=groupOfNames)(member={0}))"
  kerberos:
    enabled: false
  rate-limiter:
    enabled: false

artel:
  # Демо-стенд: очереди читаются с керберизованных RM стенда по SPNEGO, деплой заявок —
  # симуляция AWX (кластер не меняется)
  client-mode: native
  kerberos:
    principal: "artel@COMPANY.LOCAL"
    keytab: "/etc/security/keytabs/artel.keytab"
    krb5-conf: "/shared-krb5/krb5.conf"
  acl:
    enforce-four-eyes: true
  awx:
    enabled: true
    base-url: "http://mock-awx"
    token: "mock-token"
    verify-ssl: false
    default-job-template-id: 101
    simulate: true
  clusters:
    - id: "prod-yarn"
      name: "Production Hadoop Cluster"
      description: "Основной производственный YARN кластер (Capacity Scheduler)"
      resource-manager-urls:
        # Полное имя хоста: по нему клиент строит SPNEGO-принципал HTTP/<host>
        - "http://yarn-rm-1.yarn-demo-net:8088"
      kerberos-enabled: true
      impersonation-enabled: true
      default-partition: "DEFAULT"
      partitions: ["DEFAULT", "GPU", "HIGH_MEM"]
      resource-mode: "percentage"
      # Совпадает с cluster-1/capacity-scheduler.xml: RM не отдает маппинги по REST
      queue-mappings: "g:data-engineers:root.prod.spark,g:bi-analysts:root.dev"
      queue-mappings-override: false
      total-resources:
        memory-mb: 2097152
        vcores: 1024
      acl:
        allowed-users: ["*"]
        allowed-groups: ["*"]
        roles:
          admin:
            users: ["admin_user"]
            groups: ["hadoop-admins"]
          writer:
            users: ["writer_user"]
            groups: ["artel-operators"]
          reader:
            users: ["reader_user", "*"]
            groups: ["*"]

    - id: "analytics-yarn"
      name: "Analytics & ML Cluster"
      description: "Кластер для Spark, Trino и аналитических расчетов"
      resource-manager-urls:
        - "http://yarn-rm-2.yarn-demo-net:8088"
      kerberos-enabled: true
      impersonation-enabled: true
      default-partition: "DEFAULT"
      partitions: ["DEFAULT", "GPU"]
      resource-mode: "percentage"
      total-resources:
        memory-mb: 1048576
        vcores: 512
      acl:
        allowed-users: ["*"]
        allowed-groups: ["*"]
        roles:
          admin:
            users: ["admin_user"]
            groups: ["hadoop-admins"]
          writer:
            users: ["writer_user"]
            groups: ["artel-operators"]
          reader:
            users: ["reader_user", "*"]
            groups: ["*"]
