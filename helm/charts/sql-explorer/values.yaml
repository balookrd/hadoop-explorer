# Количество реплик. Внимание: при использовании локальной SQLite БД поддерживается только 1 реплика (replicaCount: 1).
# Для запуска 2 и более реплик настройте внешний PostgreSQL (config.database.url: postgresql+asyncpg://...).
replicaCount: 1

image:
  repository: sql-explorer
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Отключение буферизации для стриминга результатов SQL-запросов (Server-Sent Events)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Таймауты для длительных аналитических SQL-запросов
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
  hosts:
    - host: sql-explorer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sql-explorer-tls
      hosts:
        - sql-explorer.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Персистентное хранилище (используется при локальной SQLite БД)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

# Конфигурация приложения
config:
  server:
    host: "0.0.0.0"
    port: 8000
    debug: false
    cors_origins:
      - "https://sql-explorer.example.com"
    secure_cookies: true

  database:
    # SQLite по умолчанию: "sqlite+aiosqlite:////app/data/sql_explorer.db"
    # Для внешнего PostgreSQL: "postgresql+asyncpg://user:pass@postgres-host:5432/sql_explorer"
    url: "sqlite+aiosqlite:////app/data/sql_explorer.db"

  auth:
    # Режим аутентификации: hybrid (Kerberos SPNEGO + LDAPS), ldaps_only, kerberos_only, mock
    mode: "hybrid"
    ldap:
      enabled: true
      server_uri: "ldaps://ad.example.com:636"
      use_ssl: true
      bind_dn: "cn=svc_sql_explorer,ou=services,dc=example,dc=com"
      user_base_dn: "ou=users,dc=example,dc=com"
      user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
      user_display_name_attr: "displayName"
      user_email_attr: "mail"
      group_base_dn: "ou=groups,dc=example,dc=com"
      group_filter: "(&(objectClass=group)(member={user_dn}))"
      group_name_attr: "cn"
      ca_cert_file: "/etc/ssl/certs/ldap-ca.crt"
      allow_insecure_ssl: false

    kerberos:
      enabled: true
      keytab_file: "/etc/security/keytabs/sql-explorer.keytab"
      service_principal: "HTTP/sql-explorer.example.com@EXAMPLE.COM"

    jwt:
      algorithm: "HS256"
      expire_minutes: 480

  acl:
    ui_access:
      # "*" разрешает доступ всем успешно прошедшим аутентификацию
      allowed_users:
        - "*"
      allowed_groups:
        - "domain users"
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
      admin_groups:
        - "data-platform-admins"

  # Поддерживаемые аналитические кластеры
  clusters:
    - id: "trino-prod"
      name: "Trino Production Cluster"
      type: "trino"
      host: "trino-coordinator.analytics.svc.cluster.local"
      port: 8443
      use_ssl: true
      catalog: "hive"
      schema: "default"
      auth:
        type: "basic"
        user: "svc_sql_explorer"
        password: ""
      impersonation:
        enabled: true
        method: "x-trino-user"
      acl:
        allowed_groups:
          - "bi-analysts"
          - "data-engineers"
          - "data-platform-admins"
        allowed_users: []

    - id: "hive-core"
      name: "Apache HiveServer2 (Core DataLake)"
      type: "hive"
      host: "hs2.datalake.svc.cluster.local"
      port: 10000
      auth:
        type: "kerberos"
        kerberos_service_name: "hive"
      impersonation:
        enabled: true
        method: "doAs"
      acl:
        allowed_groups:
          - "data-engineers"
          - "data-platform-admins"
        allowed_users: []

  query_defaults:
    max_rows_in_ui: 10000
    default_limit: 1000
    auto_add_limit: true
    query_timeout_seconds: 600

# Секреты (могут передаваться через helm --set или External Secrets / Vault)
secrets:
  jwtSecret: "replace-with-a-very-long-random-string-in-production"
  ldapBindPassword: "YourLdapServiceAccountPassword"
  # Пароль базы данных PostgreSQL (опционально)
  databasePassword: ""
  # Base64-закодированный бинарный keytab файл (опционально)
  kerberosKeytabBase64: ""

# Настройка /etc/krb5.conf
kerberos:
  enabled: true
  krb5Conf: |
    [libdefaults]
        default_realm = EXAMPLE.COM
        dns_lookup_realm = false
        dns_lookup_kdc = true
        ticket_lifetime = 24h
        renew_lifetime = 7d
        forwardable = true

    [realms]
        EXAMPLE.COM = {
            kdc = kdc.example.com:88
            admin_server = kdc.example.com:749
        }

    [domain_realm]
        .example.com = EXAMPLE.COM
        example.com = EXAMPLE.COM

# Дополнительный сертификат CA для проверки LDAPS
customLdapCaCert: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Настройка сетевых политик Kubernetes NetworkPolicy
networkPolicy:
  enabled: false
  ingress:
    from: []
  egress:
    allowDns: true
    allowKerberos: true
    allowLdap: true
    allowTrino: true
    allowHive: true
