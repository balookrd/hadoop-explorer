global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'pristan'
    # Spring Boot Actuator scrape endpoint, public on the application port
    # (docs/CONFIGURATION.md, section 9). Ports: SERVER_PORT in docker/Dockerfile.*-java
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets:
          - 'artel:8000'
          - 'hdfs-explorer:8000'
          - 'sql-explorer:8003'
          - 'spark-explorer:8004'
        labels:
          env: 'production'

  - job_name: 'hadoop-replicator'
    # GET /metrics needs authentication: HTTP Basic prometheus:<REPLICATOR_METRICS_SCRAPE_TOKEN>
    metrics_path: '/metrics'
    scrape_interval: 5s
    honor_labels: true
    basic_auth:
      username: 'prometheus'
      password_file: '/etc/prometheus/secrets/replicator-metrics-scrape-token'
    static_configs:
      - targets:
          - 'replicator-orchestrator:8005'
          - 'localhost:8005'
        labels:
          app: 'replicator'
          env: 'production'
