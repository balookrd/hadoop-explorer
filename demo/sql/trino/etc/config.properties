coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Kerberos аутентификация для Trino координатора
http-server.authentication.type=KERBEROS
http-server.authentication.allow-insecure-over-http=true
http-server.authentication.krb5.service-name=trino
http-server.authentication.krb5.keytab=/etc/security/keytabs/trino.keytab
http.authentication.krb5.config=/etc/security/keytabs/krb5.conf
http-server.authentication.krb5.user-mapping.pattern=(.*)@.*
internal-communication.shared-secret=demo-trino-cluster-shared-secret-key-12345

http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/keystore.jks
http-server.https.keystore.key=password
