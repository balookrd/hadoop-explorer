server:
  port: 8003

spring:
  application:
    name: sql-explorer-demo
  datasource:
    url: jdbc:h2:file:/app/data/sql_explorer;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

zastava:
  debug: true
  auth:
    mode: hybrid
    admin-groups:
      - "data-platform-admins"
      - "hadoop-admins"
    writer-groups:
      - "data-engineers"
  jwt:
    secret-key: "demo-jwt-secret-key-change-in-production-only-min-32-chars!"
    expiration-minutes: 480
  ldap:
    enabled: true
    server-uri: "ldap://ldap:389"
    bind-dn: "cn=admin,dc=company,dc=local"
    bind-password: "adminpassword"
    user-base-dn: "ou=users,dc=company,dc=local"
    user-filter: "(|(uid={username})(cn={username}))"
    group-base-dn: "ou=groups,dc=company,dc=local"
    group-filter: "(&(objectClass=groupOfNames)(member={user_dn}))"
  kerberos:
    enabled: true
    keytab-file: "/etc/security/keytabs/sql-explorer.keytab"
    service-principal: "HTTP/sql-explorer@COMPANY.LOCAL"
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:8003"
  cookie:
    secure: false

sql:
  results-ttl-hours: 24
  max-rows-per-query: 10000
  default-page-size: 500
  ai:
    enabled: true
    url: "http://host.docker.internal:11434/v1"
    model: "qwen2.5-coder:7b"
    provider: "openai_compatible"
    # A 7B model on CPU answers in tens of seconds
    timeout-seconds: 60
  clusters:
    - id: "trino-kerberized"
      name: "Trino Cluster (Kerberos + X-Trino-User)"
      type: "trino"
      host: "trino-coordinator"
      port: 8443
      catalog: "tpch"
      schema: "sf1"
      mock-storage: false
      impersonation:
        enabled: true
        method: "x-trino-user"
      jdbc:
        ssl: true
        # Self-signed demo certificate: chain is checked against the keystore, host name is not
        ssl-verification: "CA"
        ssl-truststore-path: "/etc/sql-explorer/trino-truststore.jks"
        ssl-truststore-password: "password"   # http-server.https.keystore.key in trino/etc/config.properties
      kerberos:
        enabled: true
        principal: "svc_sql_explorer@COMPANY.LOCAL"
        keytab: "/etc/security/keytabs/sql-explorer.keytab"
        krb5-conf: "/etc/security/keytabs/krb5-nocanon.conf"   # dns_canonicalize_hostname = false, see demo/infra/kdc/entrypoint.sh
        service-name: "trino"
      allowed-groups:
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
    - id: "hive-kerberized-de"
      name: "Hive Server (DE Only - Kerberos + doAs)"
      type: "hive"
      host: "hive-server"
      port: 10000
      catalog: "default"
      schema: "default"
      mock-storage: false
      impersonation:
        enabled: true
        method: "doAs"
      kerberos:
        enabled: true
        principal: "svc_sql_explorer@COMPANY.LOCAL"
        keytab: "/etc/security/keytabs/sql-explorer.keytab"
        # _HOST -> host: hive/hive-server@..., hive/hive-server-2@... (principals of demo/infra/kdc)
        server-principal: "hive/_HOST@COMPANY.LOCAL"
      allowed-groups:
        - "data-engineers"
        - "data-platform-admins"
    - id: "hive-demo-analytics"
      name: "Hive Server 1 (Production Lakehouse - All Roles)"
      type: "hive"
      host: "hive-server"
      port: 10000
      catalog: "default"
      schema: "demo_db"
      mock-storage: false
      impersonation:
        enabled: true
        method: "doAs"
      kerberos:
        enabled: true
        principal: "svc_sql_explorer@COMPANY.LOCAL"
        keytab: "/etc/security/keytabs/sql-explorer.keytab"
        # _HOST -> host: hive/hive-server@..., hive/hive-server-2@... (principals of demo/infra/kdc)
        server-principal: "hive/_HOST@COMPANY.LOCAL"
      allowed-groups:
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
    - id: "hive-archive-analytics"
      name: "Hive Server 2 (Archive DataLake - All Roles)"
      type: "hive"
      host: "hive-server-2"
      port: 10001
      catalog: "default"
      schema: "archive_db"
      mock-storage: false
      impersonation:
        enabled: true
        method: "doAs"
      kerberos:
        enabled: true
        principal: "svc_sql_explorer@COMPANY.LOCAL"
        keytab: "/etc/security/keytabs/sql-explorer.keytab"
        # _HOST -> host: hive/hive-server@..., hive/hive-server-2@... (principals of demo/infra/kdc)
        server-principal: "hive/_HOST@COMPANY.LOCAL"
      allowed-groups:
        - "bi-analysts"
        - "data-engineers"
        - "data-platform-admins"
