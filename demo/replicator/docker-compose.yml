name: hadoop-replicator-demo

include:
  - path: ../platform/docker-compose.hms.yml
  - path: ../platform/docker-compose.hdfs.yml

services:
  # 1. Оркестратор задач и Token Bucket Throttler (Java 21 / Spring Boot 3 + Web UI + Prometheus)
  orchestrator:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-orchestrator
    container_name: replicator-orchestrator
    hostname: orchestrator
    restart: unless-stopped
    environment:
      REPLICATOR_GLOBAL_LIMIT_BYTES_PER_SEC: "104857600" # 100 MB/s
      HADOOP_REPLICATOR_AGENT_SECRET: ""
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/replicator;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE"
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      KRB5_CONFIG: "/shared/conf/krb5.conf"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/shared/conf/krb5.conf"
      HDFS_DC1_URL: "http://hdfs-cluster-1:9870"
      HDFS_DC2_URL: "http://hdfs-cluster-2:9870"
      HMS_DC1_HOST: "hive-metastore-1"
      HMS_DC1_PORT: "9083"
      HMS_DC2_HOST: "hive-metastore-2"
      HMS_DC2_PORT: "9083"
      HADOOP_STREAMING_ENABLED: "true"
      HADOOP_STREAMING_POLL_INTERVAL_MS: "1000"
      REPLICATOR_HMS_MOCK_CLUSTER_API_ENABLED: "false"
    volumes:
      - replicator-db-data:/app/data
      - shared-demo-data:/tmp/data
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "8005:8005"
    depends_on:
      kdc:
        condition: service_healthy
      hdfs-cluster-1:
        condition: service_started
      hdfs-cluster-2:
        condition: service_started
      sql-hive-metastore:
        condition: service_started
      sql-hive-metastore-2:
        condition: service_started
    networks:
      demo-platform-net:
        aliases:
          - orchestrator

  # 2. Агент DC1 (Primary ЦОД: Москва, dc1 / demo-cluster) — Полный дуплекс с Kerberos & HDFS
  agent-dc1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-agent-dc1
    hostname: agent-dc1
    restart: unless-stopped
    environment:
      AGENT_ID: "agent-dc1"
      AGENT_CLUSTER_ID: "dc1"
      AGENT_MODE: "all"
      AGENT_MAX_BANDWIDTH_MB_S: "80.0"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      RECEIVER_HOST: "0.0.0.0"
      RECEIVER_PORT: "50051"
      AGENT_ADVERTISED_ADDRESS: "agent-dc1:50051"
      FALLBACK_TARGET_ADDRESS: "agent-dc2:50051"
      REPLICATOR_STAGING_DIR: "/tmp/staging"
      POLL_INTERVAL_SEC: "2.0"
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-1:9000"
      TARGET_HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-2:9000"
      REPLICATOR_FEDERATION_MAPPINGS: "hdfs-cluster-1:9000=hdfs://hdfs-cluster-2:9000,hdfs-cluster-1=hdfs-cluster-2"
      REPLICATOR_AUTO_CREATE_TEST_DATA: "true"
      REPLICATOR_AGENT_SECRET: ""
      REPLICATOR_HMS_MODE: "thrift"
      HMS_THRIFT_URIS: "thrift://hive-metastore-1:9083"
      HMS_KERBEROS_PRINCIPAL: "hive/hive-metastore@COMPANY.LOCAL"
      KRB5_KEYTAB: "/etc/security/keytabs/hdfs-cluster-1.keytab"
      KRB5_PRINCIPAL: "hdfs/hdfs-cluster-1@COMPANY.LOCAL"
      KRB5_CONFIG: "/shared/conf/krb5.conf"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/shared/conf/krb5.conf"
    volumes:
      - agent-staging-dc1:/tmp/staging
      - shared-demo-data:/tmp/data
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "50051:50051"
    depends_on:
      - orchestrator
      - hdfs-cluster-1
      - sql-hive-metastore
    networks:
      demo-platform-net:
        aliases:
          - agent-dc1

  # 3. Агент DC2 (DR ЦОД: Санкт-Петербург, dc2 / backup-cluster) — Полный дуплекс с Kerberos & HDFS
  agent-dc2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-agent-dc2
    hostname: agent-dc2
    restart: unless-stopped
    environment:
      AGENT_ID: "agent-dc2"
      AGENT_CLUSTER_ID: "dc2"
      AGENT_MODE: "all"
      AGENT_MAX_BANDWIDTH_MB_S: "60.0"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      RECEIVER_HOST: "0.0.0.0"
      RECEIVER_PORT: "50051"
      AGENT_ADVERTISED_ADDRESS: "agent-dc2:50051"
      FALLBACK_TARGET_ADDRESS: "agent-dc1:50051"
      REPLICATOR_STAGING_DIR: "/tmp/staging"
      POLL_INTERVAL_SEC: "2.0"
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-2:9000"
      TARGET_HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-1:9000"
      REPLICATOR_FEDERATION_MAPPINGS: "hdfs-cluster-2:9000=hdfs://hdfs-cluster-1:9000,hdfs-cluster-2=hdfs-cluster-1"
      REPLICATOR_AUTO_CREATE_TEST_DATA: "true"
      REPLICATOR_AGENT_SECRET: ""
      REPLICATOR_HMS_MODE: "thrift"
      HMS_THRIFT_URIS: "thrift://hive-metastore-2:9083"
      HMS_KERBEROS_PRINCIPAL: "hive/hive-metastore-2.demo-platform-net@COMPANY.LOCAL"
      KRB5_KEYTAB: "/etc/security/keytabs/hdfs-cluster-2.keytab"
      KRB5_PRINCIPAL: "hdfs/hdfs-cluster-2@COMPANY.LOCAL"
      KRB5_CONFIG: "/shared/conf/krb5.conf"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/shared/conf/krb5.conf"
    volumes:
      - agent-staging-dc2:/tmp/staging
      - shared-demo-data:/tmp/data
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "50052:50051"
    depends_on:
      - orchestrator
      - hdfs-cluster-2
      - sql-hive-metastore-2
    networks:
      demo-platform-net:
        aliases:
          - agent-dc2

  # 4. Inotify Стример DC1 #1 (Active Leader) — мониторинг NameNode EditLog в DC1
  streamer-dc1-01:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-streamer-dc1-01
    hostname: streamer-dc1-01
    restart: unless-stopped
    environment:
      AGENT_ID: "streamer-dc1-01"
      AGENT_CLUSTER_ID: "dc1"
      AGENT_MODE: "streamer"
      HADOOP_STREAMING_ENABLED: "true"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-1:9000"
      POLL_INTERVAL_SEC: "1.0"
      KRB5_KEYTAB: "/etc/security/keytabs/hdfs-cluster-1.keytab"
      KRB5_PRINCIPAL: "hdfs/hdfs-cluster-1@COMPANY.LOCAL"
      KRB5_CONFIG: "/shared/conf/krb5.conf"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/shared/conf/krb5.conf"
    volumes:
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    depends_on:
      - orchestrator
      - hdfs-cluster-1
    networks:
      demo-platform-net:
        aliases:
          - streamer-dc1-01

  # 5. Inotify Стример DC1 #2 (Standby) — автоматический Failover при отказе лидера
  streamer-dc1-02:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-streamer-dc1-02
    hostname: streamer-dc1-02
    restart: unless-stopped
    environment:
      AGENT_ID: "streamer-dc1-02"
      AGENT_CLUSTER_ID: "dc1"
      AGENT_MODE: "streamer"
      HADOOP_STREAMING_ENABLED: "true"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-1:9000"
      POLL_INTERVAL_SEC: "1.0"
      KRB5_KEYTAB: "/etc/security/keytabs/hdfs-cluster-1.keytab"
      KRB5_PRINCIPAL: "hdfs/hdfs-cluster-1@COMPANY.LOCAL"
      KRB5_CONFIG: "/shared/conf/krb5.conf"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/shared/conf/krb5.conf"
    volumes:
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    depends_on:
      - orchestrator
      - hdfs-cluster-1
    networks:
      demo-platform-net:
        aliases:
          - streamer-dc1-02

  # 6. Inotify Стример DC2 (DR ЦОД) — резервный стример для обратной синхронизации при Failover
  streamer-dc2-01:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent
    container_name: replicator-streamer-dc2-01
    hostname: streamer-dc2-01
    restart: unless-stopped
    environment:
      AGENT_ID: "streamer-dc2-01"
      AGENT_CLUSTER_ID: "dc2"
      AGENT_MODE: "streamer"
      HADOOP_STREAMING_ENABLED: "true"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      HDFS_DEFAULT_FS: "hdfs://hdfs-cluster-2:9000"
      POLL_INTERVAL_SEC: "1.0"
      KRB5_KEYTAB: "/etc/security/keytabs/hdfs-cluster-2.keytab"
      KRB5_PRINCIPAL: "hdfs/hdfs-cluster-2@COMPANY.LOCAL"
      KRB5_CONFIG: "/shared/conf/krb5.conf"
      JAVA_TOOL_OPTIONS: "-Djava.security.krb5.conf=/shared/conf/krb5.conf"
    volumes:
      - demo-shared-keytabs:/etc/security/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    depends_on:
      - orchestrator
      - hdfs-cluster-2
    networks:
      demo-platform-net:
        aliases:
          - streamer-dc2-01

  # 7. Smoke Test Runner (End-to-End: KDC + 2x HMS + 2x HDFS -> Bootstrap -> New Table CDC -> Streamers HA)
  smoke-test:
    image: curlimages/curl:latest
    container_name: replicator-smoke-test
    depends_on:
      - orchestrator
      - agent-dc1
      - agent-dc2
      - streamer-dc1-01
      - streamer-dc1-02
      - streamer-dc2-01
      - sql-hive-metastore
      - sql-hive-metastore-2
      - hdfs-cluster-1
      - hdfs-cluster-2
    entrypoint: ["/bin/sh", "/tests/run-smoke-tests.sh"]
    volumes:
      - ./run-smoke-tests.sh:/tests/run-smoke-tests.sh:ro
      - shared-demo-data:/tmp/data
    environment:
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      HDFS1_URL: "http://hdfs-cluster-1:9870"
      HDFS2_URL: "http://hdfs-cluster-2:9870"
      HMS1_HOST: "hive-metastore-1"
      HMS1_PORT: "9083"
      HMS2_HOST: "hive-metastore-2"
      HMS2_PORT: "9083"
      KDC_HOST: "kdc"
    networks:
      demo-platform-net:
    profiles:
      - test

volumes:
  replicator-db-data:
  agent-staging-dc1:
  agent-staging-dc2:
  shared-demo-data:
