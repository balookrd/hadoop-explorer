name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # PostgreSQL for PostgresTextColumnsTest (backend/tolmach, backend/iskra, backend/artel); the tests are skipped
    # without TEST_POSTGRES_URL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pristan
          POSTGRES_PASSWORD: pristan
          POSTGRES_DB: pristan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pristan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/pristan
          TEST_POSTGRES_USER: pristan
          TEST_POSTGRES_PASSWORD: pristan
        run: mvn -B test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Собранный UI в git не хранится: бандлы попадают в ресурсы Spring Boot здесь,
      # до упаковки JAR, иначе сервисы выйдут без веб-интерфейса
      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:all
          for svc in sklad artel tolmach iskra parom/orchestrator; do
            test -f "../backend/$svc/src/main/resources/static/index.html" \
              || { echo "UI bundle missing for $svc" >&2; exit 1; }
          done

      - name: Build jars
        run: mvn -B -DskipTests package

      - name: Stage build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find backend -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*.jar.original" -exec cp {} dist/ \;
          shopt -s nullglob
          jars=(dist/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "No JAR files produced in backend modules!" >&2
            exit 1
          fi
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          ls -la

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pristan-jars
          path: |
            dist/*.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error
