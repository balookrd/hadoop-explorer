name: hadoop-replicator-demo

services:
  # 1. Оркестратор задач и Token Bucket Throttler (FastAPI + Web UI + Prometheus)
  orchestrator:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator
    container_name: replicator-orchestrator
    hostname: orchestrator
    restart: unless-stopped
    command: ["uvicorn", "backend.replicator.orchestrator.main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      REPLICATOR_GLOBAL_LIMIT_BYTES_PER_SEC: "52428800" # 50 MB/s
      REPLICATOR_DATABASE_URL: "sqlite:////app/data/replicator.db"
      REPLICATOR_SERVICE_PRINCIPAL: "hdfs-replicator@REALM.LOCAL"
    volumes:
      - replicator-db-data:/app/data
    ports:
      - "8005:8005"
    networks:
      - replicator-net

  # 2. Python Агент DC1 (Primary ЦОД: Москва, demo-cluster) — Полный дуплекс
  agent-python-dc1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator
    container_name: replicator-agent-python-dc1
    hostname: agent-dc1
    restart: unless-stopped
    command: ["python", "-m", "backend.replicator.agent"]
    environment:
      AGENT_ID: "agent-python-dc1"
      AGENT_CLUSTER_ID: "demo-cluster"
      AGENT_MODE: "all"
      AGENT_MAX_BANDWIDTH_MB_S: "40.0"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      RECEIVER_HOST: "0.0.0.0"
      RECEIVER_PORT: "50051"
      AGENT_ADVERTISED_ADDRESS: "agent-dc1:50051"
      FALLBACK_TARGET_ADDRESS: "agent-dc2:50051"
      REPLICATOR_STAGING_DIR: "/tmp/staging"
      POLL_INTERVAL_SEC: "2.0"
    volumes:
      - agent-python-staging:/tmp/staging
      - shared-demo-data:/tmp/data
    ports:
      - "50051:50051"
    depends_on:
      - orchestrator
    networks:
      - replicator-net

  # 3. Java 17 Агент DC2 (DR ЦОД: Санкт-Петербург, backup-cluster) — Полный дуплекс
  agent-java-dc2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.replicator-agent-java
    container_name: replicator-agent-java-dc2
    hostname: agent-dc2
    restart: unless-stopped
    environment:
      AGENT_ID: "agent-java-dc2"
      AGENT_CLUSTER_ID: "backup-cluster"
      AGENT_MODE: "all"
      AGENT_MAX_BANDWIDTH_MB_S: "60.0"
      ORCHESTRATOR_URL: "http://orchestrator:8005"
      RECEIVER_HOST: "0.0.0.0"
      RECEIVER_PORT: "50051"
      AGENT_ADVERTISED_ADDRESS: "agent-dc2:50051"
      FALLBACK_TARGET_ADDRESS: "agent-dc1:50051"
      REPLICATOR_STAGING_DIR: "/tmp/staging"
      POLL_INTERVAL_SEC: "2.0"
    volumes:
      - agent-java-staging:/tmp/staging
      - shared-demo-data:/tmp/data
    ports:
      - "50052:50051"
    depends_on:
      - orchestrator
    networks:
      - replicator-net

volumes:
  replicator-db-data:
  agent-python-staging:
  agent-java-staging:
  shared-demo-data:

networks:
  replicator-net:
    driver: bridge
