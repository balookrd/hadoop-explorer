server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  clusters_config_path: "config/clusters.yaml"

security:
  secret_key: "change-this-to-a-super-secret-random-key-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 480
  cookie_name: "hdfs_explorer_session"
  cookie_secure: false  # Установите true при работе за HTTPS
  cookie_samesite: "lax"

ldap:
  enabled: true
  server_uri: "ldaps://ad.example.com:636"
  use_ssl: true
  verify_cert: false  # true для продакшена с валидным CA
  ca_cert_file: null  # путь к кастомному CA cert если нужно
  bind_dn: "cn=svc-hdfs-explorer,ou=Service Accounts,dc=example,dc=com"
  bind_password: "ServiceAccountSecretPassword"
  user_base_dn: "ou=Users,dc=example,dc=com"
  user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
  username_attr: "sAMAccountName"
  user_email_attr: "mail"
  user_display_name_attr: "displayName"
  group_base_dn: "ou=Groups,dc=example,dc=com"
  group_filter: "(&(objectClass=group)(member={user_dn}))"
  group_name_attr: "cn"
  use_user_memberof: true
  memberof_attr: "memberOf"

kerberos_sso:
  enabled: false
  service_principal: "HTTP/hdfs-explorer.example.com@EXAMPLE.COM"
  keytab_path: "/etc/security/keytabs/spnego.keytab"

# Глобальный ACL для доступа к самому веб-интерфейсу
acl:
  allow_all_authenticated: false
  allowed_groups:
    - "domain users"
    - "hadoop-users"
    - "data-engineers"
    - "analytics"
  allowed_users: []
  admin_groups:
    - "hadoop-admins"
    - "domain admins"
