# Клиентский krb5.conf нагрузочного стенда: TGT живет 5 минут без продления.
# Bootstrap 200k партиций длится дольше, поэтому агент обязан перелогиниваться по keytab.
[libdefaults]
    default_realm = COMPANY.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 5m
    renew_lifetime = 0
    forwardable = true
    rdns = false
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    COMPANY.LOCAL = {
        kdc = kdc:88
        admin_server = kdc:749
        default_domain = company.local
    }
    EXAMPLE.COM = {
        kdc = kdc:88
        admin_server = kdc:749
        default_domain = example.com
    }

[domain_realm]
    .demo-platform-net = COMPANY.LOCAL
    demo-platform-net = COMPANY.LOCAL
    .yarn-demo-net = COMPANY.LOCAL
    yarn-demo-net = COMPANY.LOCAL
    .company.local = COMPANY.LOCAL
    company.local = COMPANY.LOCAL
    .example.com = COMPANY.LOCAL
    example.com = COMPANY.LOCAL
    kdc = COMPANY.LOCAL
    hdfs-explorer = COMPANY.LOCAL
    sql-explorer = COMPANY.LOCAL
    yarn-explorer = COMPANY.LOCAL
    spark-explorer = COMPANY.LOCAL
    hdfs-cluster-1 = COMPANY.LOCAL
    hdfs-cluster-2 = COMPANY.LOCAL
    hive-server = COMPANY.LOCAL
    hive-server-1 = COMPANY.LOCAL
    hive-server-2 = COMPANY.LOCAL
    hive-metastore = COMPANY.LOCAL
    hive-metastore-1 = COMPANY.LOCAL
    hive-metastore-2 = COMPANY.LOCAL
    trino-coordinator = COMPANY.LOCAL
    kafka-cluster-1 = COMPANY.LOCAL
    kafka-cluster-2 = COMPANY.LOCAL
    schema-registry-1 = COMPANY.LOCAL
    schema-registry-2 = COMPANY.LOCAL
